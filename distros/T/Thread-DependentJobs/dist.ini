[@Git]

[@Basic]

[PruneFiles]
filename = README.jima

[Git::NextVersion]
version_by_branch = 1

[Git::Push]
push_to = origin
remotes_must_exist = 1

;NO add    $pkg::VERSION = '1.234';   to perl files
;NO   except for packages declared with newline after the "package"
;NO[PkgVersion]
[OurPkgVersion]

[OurDate]
date_format=%Y-%m-%d

[AutoPrereqs]

[Prereqs]
; bigrat 0.65 may be necessary per https://rt.cpan.org/Ticket/Display.html?id=145960
; #not used in this module...#   bigrat = 0.65

[CheckPrereqsIndexed]

[PodSyntaxTests]
[PodCoverageTests]

[MetaProvides::Package]
