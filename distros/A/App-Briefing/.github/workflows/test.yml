name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile hooks/briefing-preload hooks/briefing-marketplace-notice scripts/import-binary-sums.py
          for s in bin/briefing bin/briefing-doctor .cicd/python+3.12+test.winlaunch.sh; do sh -n "$s"; done
          for f in scripts/binary-lib.sh scripts/binary-pp-args.sh scripts/binary-smoke.sh scripts/binary-verify.sh; do bash -n "$f"; done
      - name: Verify binary delivery contracts
        run: python3 -m unittest tests.test_binary_pins tests.test_starter tests.test_binary_workflow -v
      - name: Run the full reference suite
        run: python3 -m unittest discover tests -v
