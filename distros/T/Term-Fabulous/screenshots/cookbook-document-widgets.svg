<g class="terminal">
<text x="75" y="110" textLength="63" class="b" fill="#ebeef3">Version</text>
<text x="165" y="110" textLength="72" class="b" fill="#ebeef3">Released</text>
<text x="282" y="110" textLength="108" class="b" fill="#ebeef3">What changed</text>
<text x="75" y="146" textLength="27" fill="#dcdfe4">1.5</text>
<text x="165" y="146" textLength="90" fill="#dcdfe4">2025-06-20</text>
<text x="282" y="146" textLength="297" fill="#dcdfe4">a dry run shows what keep deletes</text>
<text x="75" y="164" textLength="27" fill="#dcdfe4">1.4</text>
<text x="165" y="164" textLength="90" fill="#dcdfe4">2025-01-10</text>
<text x="282" y="164" textLength="306" fill="#dcdfe4">the last release that runs on Perl</text>
<text x="597" y="164" textLength="36" fill="#101216">5.10</text>
<text x="75" y="182" textLength="27" fill="#dcdfe4">1.3</text>
<text x="165" y="182" textLength="90" fill="#dcdfe4">2024-08-05</text>
<text x="282" y="182" textLength="144" fill="#dcdfe4">exclude patterns</text>
<text x="66" y="218" textLength="9" fill="#dcdfe4">«</text>
<text x="106.5" y="218" text-anchor="middle" fill="#dcdfe4">‹</text>
<text x="129" y="218" textLength="99" fill="#dcdfe4">Page 2 of 3</text>
<text x="250.5" y="218" text-anchor="middle" fill="#dcdfe4">›</text>
<text x="282" y="218" textLength="9" fill="#dcdfe4">»</text>
<text x="327" y="218" textLength="117" fill="#8c929e">Rows per page</text>
<text x="453" y="218" textLength="9" fill="#dcdfe4">3</text>
<text x="493.5" y="218" text-anchor="middle" fill="#61afef">▾</text>
<text x="525" y="218" textLength="9" fill="#8c929e">4</text>
<text x="538.5" y="218" text-anchor="middle" fill="#8c929e">–</text>
<text x="543" y="218" textLength="54" fill="#8c929e">6 of 7</text>
<text x="39" y="254" textLength="27" class="b" fill="#ebeef3">2.1</text>
<text x="61.5" y="290" text-anchor="middle" fill="#61afef">•</text>
<text x="75" y="290" textLength="54" fill="#e5c07b">--keep</text>
<text x="138" y="290" textLength="63" fill="#dcdfe4">accepts</text>
<text x="210" y="290" textLength="27" fill="#e5c07b">all</text>
<text x="246" y="290" textLength="189" fill="#dcdfe4">to keep every backup.</text>
<text x="61.5" y="308" text-anchor="middle" fill="#61afef">•</text>
<text x="75" y="308" textLength="468" fill="#dcdfe4">The report lists the biggest files that were copied.</text>
<text x="61.5" y="326" text-anchor="middle" fill="#61afef">•</text>
<text x="75" y="326" textLength="387" fill="#dcdfe4">Hooks get the name of the backup directory:</text>
<text x="79.5" y="344" text-anchor="middle" fill="#61afef">•</text>
<text x="93" y="344" textLength="54" fill="#e5c07b">before</text>
<text x="156" y="344" textLength="18" fill="#dcdfe4">as</text>
<text x="183" y="344" textLength="126" fill="#e5c07b">$SNAPBACK_NEXT</text>
<text x="309" y="344" textLength="243" fill="#dcdfe4">, which does not exist yet;</text>
<text x="79.5" y="362" text-anchor="middle" fill="#61afef">•</text>
<text x="93" y="362" textLength="45" fill="#e5c07b">after</text>
<text x="147" y="362" textLength="18" fill="#dcdfe4">as</text>
<text x="174" y="362" textLength="126" fill="#e5c07b">$SNAPBACK_LAST</text>
<text x="300" y="362" textLength="9" fill="#dcdfe4">.</text>
<text x="57" y="398" textLength="333" fill="#dcdfe4">Upgrading from 2.0 needs no change to</text>
<text x="399" y="398" textLength="99" fill="#e5c07b">~/.snapback</text>
<text x="498" y="398" textLength="9" fill="#dcdfe4">.</text>
<text x="39" y="470" textLength="27" class="b" fill="#ebeef3">2.0</text>
</g>
