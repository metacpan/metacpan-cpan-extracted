name = App-Briefing
author = Torsten Raudssus <torsten@raudssus.de>
license = Artistic_2_0
copyright_holder = Torsten Raudssus <torsten@raudssus.de> L<https://raudssus.de/>
copyright_year = 2026
main_module = lib/App/Briefing.pm

; Farewell release: the tarball carries the stub modules, their test and the
; distribution metadata only. The plugin's files stay in the repository for its
; last version: PruneFiles takes out hooks/, CLAUDE.md, PRIVACY.md and the hook
; test t/hook.t; the dotfiles (.claude/, .claude-plugin/, .github/) stay out of the
; gathering, and @Filter drops the bundle's agent-context snapshot.
[@Filter]
-bundle = @Author::GETTY
-remove = GatherAgentContext
gather_include_dotfiles = 0

[PruneFiles]
match = ^hooks/
filename = CLAUDE.md
filename = PRIVACY.md
filename = t/hook.t
