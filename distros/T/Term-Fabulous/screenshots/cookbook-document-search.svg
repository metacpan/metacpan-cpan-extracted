<text class="title" x="390" y="33" text-anchor="middle" dominant-baseline="central" fill="#9aa3b5">perl examples/cookbook/document-search.pl</text>
<rect x="16.5" y="16.5" width="747" height="417" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
<g shape-rendering="crispEdges">
<rect x="57" y="60" width="675" height="36" fill="#1e2128"/>
<rect x="264" y="186" width="36" height="18" fill="#264f78"/>
<rect x="57" y="312" width="675" height="36" fill="#1e2128"/>
<rect x="57" y="384" width="36" height="18" fill="#e5c07b"/>
<rect x="39" y="402" width="216" height="18" fill="#242830"/>
<rect x="745" y="60" width="1" height="36" fill="#464c5a"/>
<rect x="745" y="96" width="2" height="54" fill="#61afef"/>
<rect x="745" y="150" width="1" height="252" fill="#464c5a"/>
