<g class="terminal">
<text x="39" y="92" textLength="162" class="b" fill="#3c8c32">Keys of the editor</text>
<text x="75" y="146" textLength="45" fill="#1e222a">Press</text>
<text x="129" y="146" textLength="54" class="b" fill="#0a0c10">Ctrl+S</text>
<text x="192" y="146" textLength="180" fill="#1e222a">to save the file and</text>
<text x="381" y="146" textLength="54" class="b" fill="#0a0c10">Ctrl+Q</text>
<text x="444" y="146" textLength="252" fill="#1e222a">to quit. Unsaved changes are</text>
<text x="75" y="164" textLength="306" fill="#1e222a">never lost: the editor asks first.</text>
<text x="75" y="200" textLength="180" fill="#1e222a">The settings live in</text>
<text x="264" y="200" textLength="99" fill="#1e6ec8">~/.editorrc</text>
<text x="363" y="200" textLength="9" fill="#1e222a">.</text>
<text x="381" y="200" textLength="153" fill="#fafafa">New in version 3:</text>
<text x="543" y="200" textLength="18" class="b" fill="#0a0c10">F2</text>
<text x="570" y="200" textLength="144" fill="#1e222a">switches between</text>
<text x="75" y="218" textLength="261" fill="#1e222a">the dark and the light theme.</text>
<text x="39" y="254" textLength="117" class="b" fill="#0a0c10">Moving around</text>
<text x="75" y="290" textLength="36" class="b" fill="#0a0c10">Home</text>
<text x="120" y="290" textLength="27" fill="#1e222a">and</text>
<text x="156" y="290" textLength="27" class="b" fill="#0a0c10">End</text>
<text x="192" y="290" textLength="342" fill="#1e222a">go to the start and the end of a line,</text>
<text x="543" y="290" textLength="36" class="b" fill="#1e222a">Ctrl</text>
<text x="588" y="290" textLength="108" fill="#1e222a">with them to</text>
<text x="75" y="308" textLength="306" fill="#1e222a">the start and the end of the file.</text>
</g>
