name    = MCP-Run
author  = Torsten Raudssus <getty@cpan.org>
license = Perl_5
copyright_holder = Torsten Raudssus <torsten@raudssus.de> L<https://raudssus.de/>
copyright_year   = 2026

; Getty release command:
;   dzil release
; The [@Author::GETTY] bundle handles the whole release: GitHub::CreateRelease
; publishes the GitHub release (CPAN tarball attached, ChangeLog notes) and the
; [@Author::GETTY::Docker / compress] subsection builds and pushes the Docker
; image (raudssus/mcp-run-compress — the compress hook; the mcp-run-bash
; runtime never runs in Docker) with MCP_RUN_VERSION=%v and the compress stage.
; Needs ~/.github-identity and `docker login`.
; Do NOT add a run_after_release hook or maint/ script back — the bundle owns
; the release; a duplicate GitHub release attempt dies on 422 already_exists.
; Fill the {{$NEXT}} section in Changes before releasing: dzil release aborts
; on an empty one.

[@Author::GETTY]
docker_image   = raudssus/mcp-run-compress
docker_default = 0

[@Author::GETTY::Docker / compress]
target    = compress
build_arg = MCP_RUN_VERSION=%v
