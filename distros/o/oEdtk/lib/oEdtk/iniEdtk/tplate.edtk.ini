[DEFAULT]
# DEFAULT STARTING VARIABLES 
# BECAREFUL under linux ! values should not be followed by blank
# BECAREFUL under linux ! lines must end with windows CR LF
# tplate.edtk.ini: merged mainline (M) + fork template. Defaults keep the M
# behaviour; a "# fork:" line documents the fork variant or the keys it adds.
# => SEE END OF CONFIG FILE FOR SPECIFIC CONFIGURATIONS DEPENDING ON HOSTNAME
iniEdtk  	=local
EDTK_CORP	=My Corp
EDTK_DICO	=$EDTK_DIR_CONFIG/edtk_dico.ini
EDTK_DICO_POST	=$EDTK_DIR_CONFIG/postal_dico.ini
EDTK_SNIP_ADDR	=$EDTK_DIR_CONFIG/snip_address.ini
EDTK_SNIP_RATE	=0
EDTK_LANG	=EN
# Log sensitivity read by the application (logger.pm $LOGGERLEVEL); 4 = M default.
EDTK_LOG_LVL	=4


[ENVDESC]
# DEFAULT ENVIRONNEMENT DESCRIPTION
# EDTK_PRGPATH is defined by oEdtk to show current path 
EDTK_DIR_BASE		=$EDTK_PRGPATH
# fork: EDTK_DIR_BASE = C:/editique
EDTK_DIR_APP 		=$EDTK_DIR_BASE/app
EDTK_DIR_APPTMP 	=$EDTK_DIR_SCRIPT/tmp
EDTK_DIR_CONFIG		=$EDTK_DIR_BASE/config
EDTK_DIR_DATA_IN	=$EDTK_DIR_SCRIPT/flux
EDTK_DIR_DB 		=$EDTK_DIR_APPTMP
EDTK_DIR_DOCLIB		=$EDTK_DIR_BASE/doclib
EDTK_DIR_DOCSCRIPT 	=$EDTK_DIR_SCRIPT/doc
EDTK_DIR_EDOCMNGR	=$EDTK_DIR_BASE/transit/ged
EDTK_DIR_LIB 		=$EDTK_DIR_BASE/lib
EDTK_DIR_LOG 		=$EDTK_DIR_SCRIPT/log
EDTK_DIR_OUTMNGR	=$EDTK_DIR_BASE/transit/routeur
EDTK_DIR_SCRIPT		=$EDTK_DIR_APP/$EDTK_PRGNAME
EDTK_DIR_TMPLATE	=$EDTK_DIR_LIB/template
EDTK_DOCLIB_LOCK	=$EDTK_DIR_DOCLIB/doclib.lock
EDTK_FDATAIN		=$EDTK_DIR_DATA_IN/$EDTK_PRGNAME
EDTK_FDATAOUT		=$EDTK_DIR_DATA_IN/$EDTK_PRGNAME
EDTK_FDATWORK		=$EDTK_DIR_APPTMP/$EDTK_PRGNAME
EDTK_TYPE_ENV		=Dev
# fork: EDTK_TYPE_ENV = Production
EDTK_OUTMNGR_MERGE	=no
EDTK_PRGNAME		=
EDTK_VCS_LOCATION	=
EDTK_WATERMARKTEXT	=Test Edition

;EDTK_BIN_PERL		=C:/Sources/Perl/bin
EDTK_BIN_PERL		=/usr/bin/perl
EDTK_EXT_COMP_OMGR 	=omgr
EDTK_EXT_COMPO	 	=$EDTK_EXT_LATEX
EDTK_EXT_DATA		=DAT
EDTK_EXT_DEFAULT	=$EDTK_EXT_PDF
EDTK_EXT_EXCEL		=xls
EDTK_EXT_LATEX		=tex
EDTK_EXT_PCL		=pcl
EDTK_EXT_PDF		=pdf
EDTK_EXT_PERL		=pl
EDTK_EXT_WORK		=txt

EDTK_WAITRUN		=8
EDTK_XLS_MAX_ROW	=30000


[EDTK_DB]
# ENVIRONNMENT VARIABLES FOR DATABASE
EDTK_DBI_ACQUIT			=EDTK_ACQ
EDTK_DBI_DISTRIB		=EDTK_DISTRIB
EDTK_DBI_DISTRIB_STATS	=EDTK_DISTRIB_STATS
EDTK_DBI_DSN_BAK		=dbi:SQLite:dbname=c:/temp/oEdtk_db.db
EDTK_DBI_DSN_BAK_PASS	=DBI_DSN_BAK_PASS
EDTK_DBI_DSN_BAK_USER	=DBI_DSN_BAK_USER
;EDTK_DBI_DSN			=dbi:Oracle:OEDTK
EDTK_DBI_DSN			=DBI:SQLite:dbname=$EDTK_DIR_DB/oEdtk_db.tmp
EDTK_DBI_DSN_PASS		=dbi_dsn_pwd
EDTK_DBI_DSN_USER		=dbi_dsn_user
EDTK_DBI_OUTMNGR		=EDTK_INDEX
EDTK_DBI_OUTMNGR_STATS	=EDTK_INDEX_STATS
EDTK_DBI_PARAM			=dbi:SQLite:dbname=$EDTK_DIR_CONFIG/oEdtk_param.db
;EDTK_DBI_PARAM			=EDTK_PARAM
EDTK_DBI_TRACKING		=EDTK_TRACKING
EDTK_MAX_USER_KEY		=10
# fork: EDTK_MAX_USER_KEY = 5
EDTK_TRACKING_KEYS		=O_DESIGN,O_PARAM,O_STATUS,CHANELID,COD_CAIS,COD_CTRT,LS_CHILD
EDTK_TRACK_MODE 		=SQLite
;EDTK_TRACK_MODE 		=none
EDTK_TRACK_SIG			=warn
EDTK_DB_MAX_DAYS_KEPT		=2
EDTK_DB_MAX_DAYS_KEPT_STATS =100
EDTK_DB_MAX_DAYS_TRACKED	=400
EDTK_DB_MAX_DAYS_AGREGED	=600
EDTK_DB_CHECK_AUTO			=NO
EDTK_DB_CHECK_MONTH_DAY 	=15
# --- ed_idjob primary-key mode (D16) ------------------------------------
# "yes" keeps ed_idjob in the INDEX primary key (mainline behaviour); the
# fork builds the schema without it.
EDTK_DB_PK_IDJOB		=yes
# Value written to ed_idjob when the key is kept; left empty until the S51
# gate fixes the production value.
EDTK_DB_IDJOB_DEFAULT	=
# Case-folding of column names fetched by DBAdmin (FetchHashKeyName); M
# default NAME_uc. The fork DBAdmin hard-codes NAME_uc.
EDTK_DB_FetchHashKeyName	=NAME_uc
# Bulk-load source encoding of the CSV COPY path (H8 / D20). Empty keeps the
# historical behaviour (raw bytes read as Latin-1, but a field that is valid
# UTF-8 stays as Text::CSV decoded it); a name such as UTF8 declares a file
# already in UTF-8 so it is not double-encoded. EDTK_OUT_ENCODING is not used.
EDTK_DB_COPY_ENCODING		=
# Index-deferral policy of the PostgreSQL bulk load (H4 / O4 / D40). OPT-IN: the
# bulk COPY drops the secondary indexes and the unique / foreign-key constraints,
# and rebuilds them, only when at least one of the two keys below is set. The
# deferral holds an exclusive lock on the whole table for the COPY and measured
# no speedup, whereas leaving the indexes in place made a small file on a large
# table about 35x faster; set a key only when a measured benefit justifies the
# lock. When enabled, the deferral happens only if the incoming volume is at
# least EDTK_DB_DEFER_INDEX_MIN_ROWS rows (default 10000) and at least
# EDTK_DB_DEFER_INDEX_RATIO times the table's estimated row count (default 0.1).
# Empty (the shipped default) means the deferral is off.
EDTK_DB_DEFER_INDEX_RATIO	=
EDTK_DB_DEFER_INDEX_MIN_ROWS	=
# ELT bulk-load threshold, in MiB (D60). On PostgreSQL a CSV file at least this
# large is loaded through an unconstrained TEMP staging table (one raw COPY,
# then one INSERT ... SELECT that applies the same truncation as the row-by-row
# path) instead of the parsed COPY path. 0 disables the ELT path; empty or
# invalid falls back to 50. D60 retained 50 MiB and D80 ships it.
EDTK_DB_BURST_MO		=50



[EDTK_STATS]
EDTK_DBI_STATS		=$EDTK_DBI_DSN
EDTK_DSN_STATS		=$EDTK_DBI_DSN
EDTK_DBI_STATS_USER	=$EDTK_DBI_DSN_USER
EDTK_DSN_STATS_USER	=$EDTK_DBI_DSN_USER
EDTK_DBI_STATS_PASS	=$EDTK_DBI_DSN_PASS
EDTK_DSN_STATS_PASS	=$EDTK_DBI_DSN_PASS
EDTK_STATS_TRACKING	=$EDTK_DBI_TRACKING
EDTK_STATS_OUTMNGR	=$EDTK_DBI_OUTMNGR_STATS
EDTK_STATS_DISTRIB	=$EDTK_DBI_DISTRIB_STATS
EDTK_STATS_ACQUIT	=$EDTK_DBI_ACQUIT
# Manufacturer (faconnier) filter of omgr_stats (D-S52): a comma- or
# space-separated list of ED_IDMANUFACT codes. When set, only the shipments to
# those subcontractors are reported; empty (the default) reports them all. The
# codes (ACTIMAIL, MGENTECH, ...) live here, never in the code.
EDTK_STATS_MANUFACT	=
EDTK_CSV_HEADER_METADATA =ED_REFIDDOC,ED_IDLDOC,ED_IDSEQPG,ED_SEQDOC,ED_IDJOB,ED_CPDEST,ED_VILLDEST,ED_IDDEST,ED_NOMDEST,ED_IDEMET,ED_DTEDTION,ED_TYPPROD,ED_PORTADR,ED_ADRLN1,ED_CLEGED1,ED_ADRLN2,ED_CLEGED2,ED_ADRLN3,ED_CLEGED3,ED_ADRLN4,ED_CLEGED4,ED_ADRLN5,ED_CORP,ED_DOCLIB,ED_REFIMP,ED_ADRLN6,ED_SOURCE,ED_OWNER,ED_HOST,ED_IDIDX,ED_CATDOC,ED_CODRUPT,ED_IDLOT,ED_SEQLOT,ED_DTLOT,ED_IDFILIERE,ED_SEQPGDOC,ED_NBPGDOC,ED_POIDSUNIT,ED_NBENC,ED_ENCPDS,ED_BAC_INSERT,ED_TYPED,ED_MODEDI,ED_FORMATP,ED_PGORIEN,ED_FORMFLUX,ED_IDPLI,ED_NBDOCPLI,ED_NUMPGPLI,ED_NBPGPLI,ED_NBFPLI,ED_LISTEREFENC,ED_PDSPLI,ED_TYPOBJ,ED_STATUS,ED_DTPOSTE,ED_COUNTRY,ED_IDCONTRACT,ED_IDPRODUCT,ED_WORKFLOW,ED_CHANEL_OUT
EDTK_CSV_HEADER_DISTRIB  =ED_IDLDOC,ED_IDSEQPG,ED_SEQDOC,ED_IDJOB,ED_IDLOT,ED_SEQLOT,ED_DTLOT,ED_IDFILIERE,ED_SEQPGDOC,ED_NBPGDOC,ED_WORKFLOW,ED_CHANEL_OUT
EDTK_STATS_SQL00	=SHOW TABLE STATUS
EDTK_STATS_SQL01	=SELECT TABLE_NAME AS `TABLE`, ROUND((DATA_LENGTH + INDEX_LENGTH) / 1024 / 1024) AS `SIZE (MB)` FROM INFORMATION_SCHEMA.TABLES ORDER BY (DATA_LENGTH + INDEX_LENGTH) DESC
EDTK_STATS_SQL99	=SELECT * from EDTK_TRACKING where ED_TSTAMP > ? LIMIT 100
# Extra administration queries carried over from the shared parck edtk.ini
# (MariaDB/MySQL): handy for the interactive statistics panel.
EDTK_STATS_SQL02	=SELECT * FROM edtk_admin ORDER BY ed_action_date DESC
EDTK_STATS_SQL03	=SELECT AVG(ed_action_duration), ed_oedtk_release FROM edtk_admin GROUP BY ed_oedtk_release ORDER BY ed_oedtk_release DESC
EDTK_STATS_SQL04	=SELECT DISTINCT table_name, index_name FROM information_schema.statistics
EDTK_STATS_SQL10	=SELECT * FROM edtk_tracking WHERE (ed_message LIKE '%deadlock%' OR ed_message LIKE '%fail%') ORDER BY ed_tstamp DESC
EDTK_STATS_SQL11	=SELECT * FROM edtk_tracking WHERE (ed_message LIKE 'compo_%' OR ed_message LIKE 'distri_%') ORDER BY ed_tstamp DESC LIMIT 500
EDTK_STATS_SQL12	=SELECT * FROM edtk_tracking WHERE ed_message LIKE '%deadlock%' ORDER BY ed_tstamp DESC LIMIT 100
EDTK_STATS_SQL90	=$EDTK_PRGPATH/sql/SCT-PROD.sql


