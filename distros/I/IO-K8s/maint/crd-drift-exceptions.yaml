# --check's ACCEPTED DIVERGENCE status (k133, Weg 1): a DIFFERS whose k8s
# declarations GENUINELY differ from the emitter render and which the
# maintainer has decided to KEEP as a documented, file-exact divergence. This
# is deliberately a category of its own, NOT part of ignore_cosmetic_differs:
# a cosmetic differ is one whose structural signature still matches (only
# POD/ABSTRACT/whitespace differ) and is verified by the _structural_signature
# guard; an accepted divergence is the opposite -- the k8s declarations really
# do differ, so it can never pass that guard and must not be smuggled through
# it. Listing a file here reclassifies its DIFFERS as ACCEPTED DIVERGENCE:
# dropped from the failing-differs count so --check exits 0 on it, listed with
# its diff under --verbose. Matching is strictly provider + exact `path`
# (lib/-relative "IO/K8s/<Provider>/<Version>/<File>.pm") with no globs or
# regex, so the category can only ever affect the exact files it names and can
# never mask structural drift on any other file. Kept deliberately small; each
# entry needs a one-line reason and a ticket ref.
#
# ExternalSecrets (k133 Weg 1 / k55 / k120): the typed-empty-vs-opaque-hash
# UUIDSpec choice. generators.external-secrets.io/v1alpha1 models uuids .spec
# (and ClusterGenerator's uuid generator, uuidSpec) as a property-less
# {type: object}; AutoGen keeps a property-less object opaque (k55), so the
# emitter types both reference sites as { Str => 1 } and emits no UUIDSpec,
# while lib deliberately keeps the named empty struct UUIDSpec as a superset.
# k133 chose Weg 1 -- keep lib as-is and accept these two residual
# reference-site divergences here, rather than drop the class (Deprecated) or
# teach AutoGen a forced-struct hook.
accept_structural_divergence:
  - provider: ExternalSecrets
    path: IO/K8s/ExternalSecrets/V1alpha1/UUID.pm
    reason: "k133 Weg 1 / k55 / k120: typed-empty UUIDSpec deliberately kept as a superset -- lib types spec as +IO::K8s::ExternalSecrets::V1alpha1::UUIDSpec, the emitter renders the opaque { Str => 1 }"
  - provider: ExternalSecrets
    path: IO/K8s/ExternalSecrets/V1alpha1/ClusterGeneratorGenerator.pm
    reason: "k133 Weg 1 / k55 / k120: typed-empty UUIDSpec deliberately kept as a superset -- lib types uuidSpec as +IO::K8s::ExternalSecrets::V1alpha1::UUIDSpec, the emitter renders the opaque { Str => 1 }"
