name = DBIO-Forked
copyright_year = 2026

[@DBIO]
share_skill = dbio-forked

; A perl without a real fork() cannot run this dist (one process per query).
; The check goes at the head of the generated Makefile.PL after every build,
; so the tarball and every build directory carry it.
[Run::AfterBuild]
run = %x maint/assert-fork-capability.pl %d
