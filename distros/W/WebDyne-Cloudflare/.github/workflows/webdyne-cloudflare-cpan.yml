name: WebDyne Cloudflare CPAN release

on:
  push:
    tags:
      - 'cpan-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1.44.0
        with:
          perl-version: '5.44.0'

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          cpanm --notest --installdeps .
          npm ci --ignore-scripts

      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(perl -Ilib -MWebDyne::Cloudflare -e 'print $WebDyne::Cloudflare::VERSION')"
          test "$RELEASE_TAG" = "cpan-v$version"

      - name: Build and test distribution
        id: dist
        run: |
          perl Makefile.PL
          make test
          make disttest
          make dist
          dist_file="$(find . -maxdepth 1 -type f -name 'WebDyne-Cloudflare-*.tar.gz' -print)"
          test "$(printf '%s\n' "$dist_file" | sed '/^$/d' | wc -l)" -eq 1
          dist_file="${dist_file#./}"
          echo "dist_file=$dist_file" >> "$GITHUB_OUTPUT"

      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.dist.outputs.dist_file }}

      - name: Upload distribution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webdyne-cloudflare-cpan-${{ github.ref_name }}
          path: ${{ steps.dist.outputs.dist_file }}
          if-no-files-found: error

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_FILE: ${{ steps.dist.outputs.dist_file }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DIST_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WebDyne::Cloudflare ${GITHUB_REF_NAME#cpan-v}" \
            --generate-notes
