name: binaries
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach; empty = probe run
        required: false
jobs:
  binaries:
    permissions:
      contents: write
    uses: Getty/p5-dist-zilla-pluginbundle-author-getty/.github/workflows/dzil-binary.yml@c339eef236d6ef182205d4235128a72920a90756
    with:
      bundle_ref: c339eef236d6ef182205d4235128a72920a90756
      tag: ${{ github.event.release.tag_name || inputs.tag }}

  # The plugin's own entry point in front of each platform's packed asset of this run:
  # bin/briefing (POSIX), or bin/briefing.exe -> bin/briefing-bootstrap.exe (Windows),
  # driven by tests/test_binary_chain.py. It only reads. It needs the whole reusable
  # workflow, so in a release run it starts after the assets were uploaded: release
  # evidence, not an upload gate. The runners are the bundle's smoke runners (plan.pl).
  chain:
    name: chain ${{ matrix.platform }}
    needs: binaries
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-x86_64
            runner: macos-26-intel
          - platform: macos-arm64
            runner: macos-26
          - platform: windows-x86_64
            runner: windows-2022
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The bundle names each build artifact <dist>-<version>-<platform>; it holds the
      # assets under their release names.
      - name: Fetch the platform's packed asset
        uses: actions/download-artifact@v8
        with:
          pattern: '*-${{ matrix.platform }}*'
          merge-multiple: true
          path: bins
      - name: Run the plugin chain against the asset
        run: |
          set -euo pipefail
          suffix=
          python=python3
          case $PLATFORM in windows-*) suffix=.exe; python=python ;; esac
          shopt -s nullglob
          assets=(bins/briefing-*-"$PLATFORM"$suffix)
          if [ "${#assets[@]}" -ne 1 ]; then
            echo "::error::want exactly one briefing-*-$PLATFORM$suffix asset, found ${#assets[@]}: ${assets[*]-}"
            exit 1
          fi
          chmod +x "${assets[0]}"
          "$python" tests/test_binary_chain.py "${assets[0]}" -v
