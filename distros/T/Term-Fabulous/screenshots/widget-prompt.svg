<text x="48" y="92" textLength="72" class="b" fill="#6e6f72">Contacts</text>
<text x="48" y="128" textLength="45" fill="#6e6f72">Grace</text>
<text x="48" y="146" textLength="54" fill="#6e6f72">Alan T</text>
<text x="129" y="146" textLength="99" class="b" fill="#dcdfe4">New contact</text>
<text x="129" y="182" textLength="441" fill="#dcdfe4">The name is required. The e-mail address may stay</text>
<text x="129" y="200" textLength="54" fill="#dcdfe4">empty.</text>
<text x="129" y="236" textLength="171" fill="#dcdfe4">Name   Ada Lovelace</text>
<text x="129" y="272" textLength="54" fill="#dcdfe4">E-mail</text>
<text x="192" y="272" textLength="90" fill="#e06c75">ada@engine</text>
<text x="129" y="308" textLength="351" fill="#e06c75">E-mail: Please enter an e-mail address.</text>
<text x="147" y="362" textLength="27" fill="#dcdfe4">Add</text>
<text x="228" y="362" textLength="54" fill="#dcdfe4">Cancel</text>
<text x="48" y="434" textLength="495" fill="#6e6f72">n adds a contact, d deletes the last one, Ctrl+C quits.</text>
</g>
