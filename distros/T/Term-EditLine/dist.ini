name             = Term-EditLine
author           = Ulrich Burgbacher <ulrich@burgbacher.net>
author           = Graham Ollis <plicease@cpan.org>
license          = Perl_5
copyright_holder = Ulrich Burgbacher
copyright_year   = 2003-2026
version          = 0.12

[@Author::Plicease]
:version           = 2.79
release_tests      = 1
installer          = Author::Plicease::MakeMaker
release_tests_skip = changes\.t
test2_v0           = 1
github_user        = uperl

workflow = static
workflow = linux

[RemovePrereqs]
remove = strict
remove = warnings
remove = Exporter
remove = AutoLoader
remove = Carp

[Prereqs / TestRequires]
Test::More = 0.96

[Author::Plicease::Upload]
cpan = 1

[PruneFiles]
filename = xt/release/changes.t
filename = const-c.inc
filename = const-xs.inc
filename = xt/author/pod_coverage.t

[AlienBase::Wrapper::Bundle]
:version = 0.26

[CopyFilesFromBuild / CopyAlienBaseWrapper]
copy = inc/Alien/Base/Wrapper.pm
