<g class="terminal">
<text x="39" y="74" textLength="72" class="b" fill="#61afef">snapback</text>
<text x="57" y="128" textLength="72" class="b" fill="#dcdfe4">snapback</text>
<text x="138" y="128" textLength="531" fill="#dcdfe4">copies the files of a directory to a backup disk. It copies</text>
<text x="678" y="128" textLength="36" class="i" fill="#dcdfe4">only</text>
<text x="57" y="146" textLength="630" fill="#dcdfe4">the files that changed since the last run, so the first backup takes a</text>
<text x="57" y="164" textLength="360" fill="#dcdfe4">while and every later one takes seconds.</text>
<text x="57" y="200" textLength="198" fill="#dcdfe4">This manual covers the</text>
<text x="264" y="200" textLength="108" fill="#61afef">installation</text>
<text x="372" y="200" textLength="54" fill="#dcdfe4">, your</text>
<text x="435" y="200" textLength="108" fill="#61afef">first backup</text>
<text x="543" y="200" textLength="45" fill="#dcdfe4">, the</text>
<text x="597" y="200" textLength="72" fill="#61afef">settings</text>
<text x="678" y="200" textLength="27" fill="#dcdfe4">and</text>
<text x="57" y="218" textLength="45" fill="#61afef">hooks</text>
<text x="102" y="218" textLength="360" fill="#dcdfe4">. Answers to common questions are in the</text>
<text x="471" y="218" textLength="27" fill="#61afef">FAQ</text>
<text x="498" y="218" textLength="9" fill="#dcdfe4">.</text>
<text x="39" y="254" textLength="108" class="b" fill="#ebeef3">Installation</text>
<text x="57" y="290" textLength="576" fill="#dcdfe4">snapback is a single Perl script. Copy it to a directory in your</text>
<text x="642" y="290" textLength="36" fill="#e5c07b">PATH</text>
<text x="687" y="290" textLength="27" fill="#dcdfe4">and</text>
<text x="57" y="308" textLength="171" fill="#dcdfe4">make it executable:</text>
<text x="66" y="344" textLength="162" fill="#dcdfe4">cp snapback ~/bin/</text>
<text x="66" y="362" textLength="207" fill="#dcdfe4">chmod +x ~/bin/snapback</text>
<text x="57" y="398" textLength="540" fill="#dcdfe4">It needs Perl 5.32 or later and no modules outside the core.</text>
<text x="39" y="434" textLength="153" class="b" fill="#ebeef3">Your first backup</text>
<text x="57" y="470" textLength="18" fill="#61afef">1.</text>
<text x="93" y="470" textLength="585" fill="#dcdfe4">Connect the backup disk and note where it is mounted, for example</text>
<text x="93" y="488" textLength="99" fill="#e5c07b">/mnt/backup</text>
<text x="192" y="488" textLength="9" fill="#dcdfe4">.</text>
</g>
