name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simpici:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: Getty/simpici/action@main
        env:
          SIMPICI_CONCURRENCY: "2"

  bootstrap-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install the pinned bootstrap compiler
        run: python -m pip install --disable-pip-version-check ziglang==0.13.0.post1
      - name: Build and test the native Windows bootstrap
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci-bootstrap | Out-Null
          $bootstrap = Join-Path $env:GITHUB_WORKSPACE '.ci-bootstrap\briefing-bootstrap.exe'
          python briefing-bootstrap/build.py "$bootstrap"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fresh = (Get-FileHash -Algorithm SHA256 -LiteralPath $bootstrap).Hash.ToLowerInvariant()
          $committed = (Get-FileHash -Algorithm SHA256 -LiteralPath bin/briefing-bootstrap.exe).Hash.ToLowerInvariant()
          if ($fresh -ne $committed) {
            Write-Output "::error::bin/briefing-bootstrap.exe (sha256 $committed) is not the reproducible build of briefing-bootstrap/briefing-bootstrap.c (sha256 $fresh); rebuild it with python3 briefing-bootstrap/build.py bin/briefing-bootstrap.exe"
            exit 1
          }
          python tests/test_briefing_bootstrap.py "$bootstrap" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  perl-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        perl-version: ['5.36', '5.38', '5.40']
    container:
      image: perl:${{ matrix.perl-version }}-bookworm
    env:
      DZIL_BINARY_SKIP: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Trust the job checkout inside its container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Show build Perl
        run: perl -V
      - uses: Getty/p5-dist-zilla-pluginbundle-author-getty/.github/actions/dzil-test@main
      - name: Build the source archive for native installation tests
        if: matrix.perl-version == '5.40'
        run: dzil build
      - name: Save the test source distribution, not a release
        if: matrix.perl-version == '5.40'
        uses: actions/upload-artifact@v4
        with:
          name: app-briefing-source
          path: App-Briefing-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  perl-native:
    needs: perl-distribution
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            perl-version: '5.20'
            distribution: default
            label: linux-minimum
          - os: ubuntu-24.04
            perl-version: '5.40'
            distribution: default
            label: linux
          - os: macos-15-intel
            perl-version: '5.40'
            distribution: default
            label: macos-intel
          - os: windows-2022
            perl-version: '5.40'
            distribution: strawberry
            label: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: Installed distribution / ${{ matrix.label }} / Perl ${{ matrix.perl-version }}
    env:
      PERL_CPANM_OPT: --mirror https://cpan.metacpan.org --mirror-only
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}
          distribution: ${{ matrix.distribution }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: app-briefing-source
          path: .ci-dist
      - name: Install dependencies, then test and install the source archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archives=(.ci-dist/App-Briefing-*.tar.gz)
          test "${#archives[@]}" -eq 1
          prefix="$GITHUB_WORKSPACE/.ci-install"
          cpanm --notest --installdeps --local-lib-contained "$prefix" "${archives[0]}"
          cpanm --local-lib-contained "$prefix" "${archives[0]}"
      - name: Install dependencies with native Windows Perl
        if: runner.os == 'Windows'
        timeout-minutes: 15
        # Git Bash would prepend its own incomplete Perl to PATH.
        shell: pwsh
        run: |
          Get-Command perl, cpanm | Select-Object Name, Source
          perl -V:archname
          $archives = @(Get-ChildItem .ci-dist/App-Briefing-*.tar.gz)
          if ($archives.Count -ne 1) { throw 'Expected exactly one source archive' }
          $archive = $archives[0].FullName
          $prefix = "$env:GITHUB_WORKSPACE/.ci-install"
          # Closed stdin: nothing in the build may wait for input.
          $null | cpanm --verbose --notest --installdeps --local-lib-contained "$prefix" "$archive"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose the Windows test run verbosely
        if: runner.os == 'Windows'
        timeout-minutes: 10
        # Names the test that hangs; the step timeout cancels it.
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PERL5LIB = "$env:GITHUB_WORKSPACE/.ci-install/lib/perl5"
          $null | prove -lr -v --timer t
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and install with native Windows Perl
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem .ci-dist/App-Briefing-*.tar.gz)[0].FullName
          $prefix = "$env:GITHUB_WORKSPACE/.ci-install"
          $null | cpanm --verbose --local-lib-contained "$prefix" "$archive"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Select and verify the installed library and CLI
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          prefix = (Path.cwd() / '.ci-install').resolve()
          perl = shutil.which('perl')
          assert perl, 'Perl must be provided by setup-perl'
          script = prefix / 'bin' / 'briefing'
          command = [perl, str(script)]
          if not script.is_file():
              script = prefix / 'bin' / 'briefing.bat'
              assert script.is_file(), 'Installed briefing CLI is missing'
              command = [perl, '-x', str(script)]
          assert not list((prefix / 'bin').glob('briefing-doctor*')), 'Old plugin doctor must not be installed by CPAN'
          lib = str(prefix / 'lib' / 'perl5')
          old = os.environ.get('PERL5LIB', '')
          perl5lib = lib + (os.pathsep + old if old else '')
          env = dict(os.environ, PERL5LIB=perl5lib)
          loaded = subprocess.check_output(
              [perl, '-MApp::Briefing', '-e', 'print $INC{"App/Briefing.pm"}'],
              env=env, text=True,
          )
          Path(loaded).resolve().relative_to(prefix)
          print('Installed App::Briefing:', loaded)
          subprocess.run(command + ['--version'], env=env, check=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('PERL5LIB=' + perl5lib + '\n')
              output.write('BRIEFING_TEST_CLI=' + json.dumps(command) + '\n')
      - name: Run contracts against the installed Perl CLI
        run: python -m unittest discover tests -v
      - name: Save CPAN build logs for failed native runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cpan-logs-${{ matrix.label }}
          path: ~/.cpanm/work/*/build.log
          if-no-files-found: warn
          retention-days: 7
