<g class="terminal">
<text x="66" y="74" textLength="162" fill="#dcdfe4">cp snapback ~/bin/</text>
<text x="66" y="92" textLength="207" fill="#dcdfe4">chmod +x ~/bin/snapback</text>
<text x="57" y="128" textLength="540" fill="#dcdfe4">It needs Perl 5.32 or later and no modules outside the core.</text>
<text x="39" y="164" textLength="153" class="b" fill="#ebeef3">Your first backup</text>
<text x="57" y="200" textLength="18" fill="#61afef">1.</text>
<text x="93" y="200" textLength="585" fill="#dcdfe4">Connect the backup disk and note where it is mounted, for example</text>
<text x="93" y="218" textLength="99" fill="#e5c07b">/mnt/backup</text>
<text x="192" y="218" textLength="9" fill="#dcdfe4">.</text>
<text x="57" y="236" textLength="18" fill="#61afef">2.</text>
<text x="93" y="236" textLength="612" fill="#dcdfe4">Make a dry run, which lists the files snapback would copy and copies</text>
<text x="93" y="254" textLength="72" fill="#dcdfe4">nothing.</text>
<text x="57" y="272" textLength="18" fill="#61afef">3.</text>
<text x="93" y="272" textLength="594" fill="#dcdfe4">Run the backup itself. The first one copies every file; later ones</text>
<text x="93" y="290" textLength="198" fill="#dcdfe4">copy only the changes.</text>
<text x="66" y="326" textLength="378" fill="#dcdfe4">snapback --dry-run ~/Documents /mnt/backup</text>
<text x="66" y="344" textLength="288" fill="#dcdfe4">snapback ~/Documents /mnt/backup</text>
<text x="57" y="380" textLength="648" fill="#dcdfe4">Each run creates a directory named after the date and time on the backup</text>
<text x="57" y="398" textLength="36" fill="#101216">disk</text>
<text x="93" y="398" textLength="585" fill="#dcdfe4">. Files that did not change are hard links to the copy of the run</text>
<text x="39" y="416" textLength="36" fill="#dcdfe4">disk</text>
<text x="273" y="416" textLength="279" fill="#96a0b4">match 3 of 6  Installation  15%</text>
</g>
<g shape-rendering="crispEdges">
</g>
</svg>
