name    = Robots-Validate
author  = Robert Rothenberg <perl@rhizomnic.com>
license = Artistic_2_0
copyright_holder = Robert Rothenberg
copyright_year   = 2018-2026

[Keywords]
keyword = crawler
keyword = robots
keyword = security
keyword = verification

[GatherDir]
exclude_match = cpanfile*
exclude_filename = LICENSE
exclude_filename = SECURITY.md
exclude_filename = doap.xml
prune_directory = ^local
[PruneCruft]
[CPANFile]
[License]
[DOAP]
[ExecDir]
[ShareDir]
[MakeMaker]
[ManifestSkip]
[Manifest]
[TestRelease]
[CheckExtraTests]
[ConfirmRelease]
[SigStore::SignRelease]

[RecommendedPrereqs]
[AutoPrereqs]
; [RemovePrereqs]

; [EnsurePrereqsInstalled]
; :version = 0.003
; type = requires
; type = recommends

[Prereqs / BuildRecommends ]
-phase = build
-relationship = recommends
ExtUtils::MakeMaker = 7.22
Module::Metadata = 1.000015

[Prereqs / ConfigureSuggests ]
-phase = configure
-relationship = suggests
HTTP::Tiny = 0.096
JQ::Lite = 2.49
String::Util = 1.36

[Prereqs / TestRequires ]
-phase = test
-relationship = requires
Path::Tiny = 0

[Prereqs / RuntimeRecommends ]
-phase = runtime
-relationship = recommends
Algorithm::AhoCorasick::XS = 0.04
Net::DNS = 1.57
Net::IP::LPM = 1.12
Scalar::Util = 1.64
TOML::XS = 0.06

[StaticInstall]
mode = auto
dry_run = 0

[GitHub::Meta]
repo = git://github.com/robrwo/Robots-Validate.git

[AutomationPolicy]
template = human_supervised

[SecurityPolicy]
; authordep Software::Security::Policy::Individual
-policy = Individual
-policy_version = 0.10
timeframe = two weeks
git_url = https://github.com/robrwo/Robots-Validate
report_url = https://github.com/robrwo/Robots-Validate/security/advisories

[PodWeaver]
; authordep Pod::Weaver::Plugin::AppendPrepend
; authordep Pod::Weaver::Section::Contributors
; authordep Pod::Weaver::Section::SourceGitHub
[UsefulReadme]
type     = gfm
filename = README.md
location = build

[CopyFilesFromBuild]
copy = LICENSE
copy = SECURITY.md
copy = cpanfile
copy = README.md
copy = doap.xml

[Metadata]
x_authority    = cpan:RRWO

[MetaProvides::Package]
[MetaJSON]
[MetaYAML]

; authordep Test::Warnings

[PodSyntaxTests]
[Test::DistManifest]
; authordep Test::DistManifest
[Test::CleanNamespaces]
; authordep Test::CleanNamespaces
[Test::EOF]
; authordep Test::EOF
[Test::EOL]
:version = 0.14
[Test::Fixme]
[Test::MinimumVersion]
[Test::NoTabs]
[Test::Perl::Critic]
critic_config = xt/etc/perlcritic.rc

[Test::Pod::Coverage::Configurable]
[Test::Pod::LinkCheck]
[Test::Portability]
[Test::TrailingSpace]
; authordep Test::TrailingSpace
filename_regex = \.(?:p[lm]|pod)\z
[Test::Kwalitee]
; authordep Test::Kwalitee
skiptest = use_strict
[Test::ReportPrereqs]
:version = 0.022
version_extractor = Module::Metadata
verify_prereqs = 1

[Test::PodSpelling]
[MojibakeTests]
[Test::MixedScripts]
; authordep Test::MixedScripts

[Test::CPAN::Changes]
; authordep Test::CPAN::Changes

[Test::UnusedVars]
[MetaTests]

[Test::Version]
[Test::Compile]
; authordep Test::Compile
filename = xt/00-compile.t

;; [Test::CVE]
;; -skip = xt/etc/cve.skip

[@Git]
allow_dirty = dist.ini
push_to     = origin master:master
tag_format  = %v
commit_msg  = %v%n%n%c

[Git::Contributors]
:version = 0.019
remove   = robrwo

[RewriteVersion]
[NextRelease]
[BumpVersionAfterRelease]

[Git::Commit / Commit_Changes] ; commit Changes (for new dev)
allow_dirty_match = ^lib/
commit_msg = build: Commit Changes and bump $VERSION
