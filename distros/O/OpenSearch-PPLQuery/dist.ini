name    = OpenSearch-PPLQuery
author  = John Karr <brainbuz@brainbuz.org>
license = GPL_3
copyright_holder = John Karr
copyright_year   = 2026

; The main module's POD is injected after the build, so dzil cannot read an
; abstract out of it. Declare it here instead.
abstract = Run OpenSearch Piped Processing Language queries from the command line

version = 1.0.0

[GatherDir]
[PkgVersion]
[PruneCruft]
[ManifestSkip]
[MetaYAML]
[MetaJSON]
[MetaResources]
repository.url = https://codeberg.org/brainbuz/pplquery
repository.web = https://codeberg.org/brainbuz/pplquery
repository.type = git
bugtracker.web = https://codeberg.org/brainbuz/pplquery/issues
[ExecDir]
[ShareDir]
[MakeMaker]
[Manifest]
; [License]
[TestRelease]
[ConfirmRelease]
[UploadToCPAN]
[RunExtraTests]

; Inject PPLQuery.pod at the '## POD ##' placeholder in both the main module
; and the bin script, and regenerate README.md from the same source. The POD
; is authored once in the .pod file; the .pm and the script carry only the
; placeholder, which is replaced in the build directory (%d).
[Run::AfterBuild]
run = perl bin/inject_pod.pl PPLQuery.pod %d/lib/OpenSearch/PPLQuery.pm %d/bin/pplquery
run = pod2markdown PPLQuery.pod README.md

; The POD source and its build-time helper are inputs, not shipped files.
[PruneFiles]
filename = bin/inject_pod.pl
filename = PPLQuery.pod

[Prereqs::FromCPANfile]
