title: PreToolUse hooks deny a call by exit code 2 and by JSON; the model gets the reason (ADR 0022)
files:
  .claude/settings.json: |
    { "hooks": { "PreToolUse": [
      { "matcher": "Bash", "hooks": [ { "type": "command", "command": "${CLAUDE_PROJECT_DIR}/hooks/no-rm", "args": [] } ] },
      { "matcher": "Write|Edit", "hooks": [ { "type": "command", "command": "${CLAUDE_PROJECT_DIR}/hooks/no-env", "args": [] } ] }
    ] } }
  hooks/no-rm: |
    #!/bin/sh
    input=$(cat)
    case "$input" in *'"command":"rm '*) echo "Blocked: rm commands are not allowed" >&2; exit 2;; esac
    exit 0
  hooks/no-env: |
    #!/bin/sh
    input=$(cat)
    case "$input" in *'/.env"'*) printf '%s' '{"hookSpecificOutput":{"hookEventName":"PreToolUse","permissionDecision":"deny","permissionDecisionReason":"never write .env"}}';; esac
    exit 0
  keep.txt: keep
executable: [ hooks/no-rm, hooks/no-env ]
prompt: Tidy up.
script:
  - tool_calls:
      - [ bash, { command: rm -f keep.txt } ]
      - [ write_file, { path: .env, content: SECRET=1 } ]
      - [ bash, { command: echo fine } ]
  - text: done
expect:
  files: { keep.txt: keep }
  absent: [ .env ]
  tools:
    - { name: bash, error: true, text: "\\APreToolUse:Bash hook error: Blocked: rm commands are not allowed\\z" }
    - { name: write_file, error: true, text: "\\Anever write \\.env\\z" }
    - { name: bash, text: fine }
  events:
    - { type: hook.ran, hook_event: PreToolUse, outcome: block, exit: 2, source: .claude/settings.json }
    - { type: tool.result, name: bash }
    - { type: hook.ran, hook_event: PreToolUse, outcome: success, exit: 0 }
    - { type: tool.result, name: write_file }
