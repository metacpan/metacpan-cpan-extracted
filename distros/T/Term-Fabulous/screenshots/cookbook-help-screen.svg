<text x="48" y="92" textLength="36" fill="#6e6f72">To d</text>
<text x="111" y="110" textLength="198" class="b" fill="#dcdfe4">Keys of the to-do list</text>
<text x="48" y="128" textLength="27" fill="#305777">[x]</text>
<text x="48" y="146" textLength="27" fill="#6e6f72">[ ]</text>
<text x="111" y="146" textLength="9" fill="#343a48">S</text>
<text x="120" y="146" textLength="198" fill="#787e8a">earch keys and actions</text>
<text x="48" y="164" textLength="27" fill="#6e6f72">[ ]</text>
<text x="48" y="182" textLength="27" fill="#305777">[x]</text>
<text x="120" y="182" textLength="198" class="b" fill="#ebeef3">Keys            Action</text>
<text x="124.5" y="218" text-anchor="middle" class="b" fill="#61afef">▾</text>
<text x="138" y="218" textLength="90" class="b" fill="#61afef">Everywhere</text>
<text x="120" y="236" textLength="180" fill="#dcdfe4">F1              Keys</text>
<text x="120" y="254" textLength="225" fill="#dcdfe4">Ctrl+A          Check all</text>
<text x="120" y="272" textLength="243" fill="#dcdfe4">Ctrl+D          Remove done</text>
<text x="120" y="290" textLength="252" fill="#dcdfe4">Alt+s           Sort by name</text>
<text x="120" y="308" textLength="180" fill="#dcdfe4">Ctrl+Q          Quit</text>
<text x="124.5" y="326" text-anchor="middle" class="b" fill="#61afef">▾</text>
<text x="138" y="326" textLength="72" class="b" fill="#61afef">The list</text>
<text x="120" y="344" textLength="396" fill="#dcdfe4">Tab, Shift+Tab  The next, the previous to-do</text>
<text x="120" y="362" textLength="378" fill="#dcdfe4">Space, Enter    Check or uncheck the to-do</text>
<text x="124.5" y="380" text-anchor="middle" class="b" fill="#61afef">▾</text>
<text x="138" y="380" textLength="81" class="b" fill="#61afef">This help</text>
<text x="120" y="398" textLength="432" fill="#dcdfe4">Typing          Show only the keys with the text</text>
<text x="120" y="416" textLength="270" fill="#dcdfe4">Escape          Close the help</text>
<text x="129" y="470" textLength="45" fill="#dcdfe4">Close</text>
</g>
