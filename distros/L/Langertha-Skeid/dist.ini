name    = Langertha-Skeid
author  = Torsten Raudssus <torsten@raudssus.de> L<https://raudssus.de/>
license = Perl_5
copyright_holder = Torsten Raudssus
copyright_year   = 2026

; Getty release command:
;   dzil release
; Optional Docker overrides during release (passed to `docker build`). LANGERTHA_SRC
; installs Langertha before the cpanfile is resolved, for when the version the cpanfile
; pins is uploaded but not yet indexed. It takes anything cpanm installs, a CPAN author
; path or a tarball URL; keep the version in step with the cpanfile pin:
;   SKEID_DOCKER_BUILD_ARGS='--build-arg LANGERTHA_SRC=GETTY/Langertha-0.503.tar.gz' dzil release
; Note: do not use GitHub source archives (/archive/refs/*) for dzil dists.

[@Author::GETTY]
irc = #langertha
irc_user = Getty
; Git::GatherDir ships every tracked file, so development infrastructure has to be
; excluded explicitly or it silently joins the CPAN tarball. bench/ additionally needs
; a C compiler and must never reach a CPAN tester.
gather_exclude_match = ^\.claude/
gather_exclude_match = ^bench/
gather_exclude_match = ^docs/
gather_exclude_match = ^CONTEXT\.md$
gather_exclude_match = ^CLAUDE\.md$
run_after_release = ${GH_BIN:-gh} release view %v -R Getty/langertha-skeid >/dev/null 2>&1 || ${GH_BIN:-gh} release create %v -R Getty/langertha-skeid --title %v --notes 'Dist::Zilla release'
run_after_release = ${GH_BIN:-gh} release upload %v -R Getty/langertha-skeid Langertha-Skeid-%v.tar.gz --clobber
run_after_release = docker build ${SKEID_DOCKER_BUILD_ARGS:-} -t raudssus/langertha-skeid:%v -t raudssus/langertha-skeid:latest -t raudssus/langertha-skeid:$(echo %v | cut -d. -f1) %d
run_after_release = docker push raudssus/langertha-skeid:%v
run_after_release = docker push raudssus/langertha-skeid:$(echo %v | cut -d. -f1)
run_after_release = docker push raudssus/langertha-skeid:latest
