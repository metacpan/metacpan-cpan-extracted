name = App-Pvim
author = Brett Estrade <OODLER@cpan.org>
license = Perl_5
copyright_holder = Brett Estrade
copyright_year = 2026
main_module = lib/App/Pvim.pm

; Author-only local plugin reads the version and full runtime from pvim.
; It generates the CPAN metadata module and installed script in the build.
[=inc::Pvim::Build]

[GatherDir]
; Only these source/documentation paths belong in a CPAN distribution. Keep
; CI configuration, agent instructions and arbitrary root files out of the kit.
exclude_match = ^(?!(?:pvim|README\.md|Changes|LICENSE|ARTISTIC|COPYING|dist\.ini|inc/Pvim/Build\.pm|t/[^/]+\.t|tools/[^/]+\.(?:pl|sh)|docs/(?:wiki/)?[^/]+\.md)$)
exclude_match = (?:^|/)(?:\.cache|node_modules)(?:/|$)
exclude_match = (?:\.bak|\.tdy|\.sw[op]|~|\.log)$
exclude_match = ^(?:dist|build|local|\.build|\.git)(?:/|$)
exclude_match = ^App-Pvim-[^/]+(?:/|\.tar\.gz$)
exclude_match = ^(?:blib|cover_db)(?:/|$)
exclude_filename = Makefile
exclude_filename = MYMETA.json
exclude_filename = MYMETA.yml
exclude_filename = pm_to_blib
exclude_match = ^tools/
exclude_match = ^docs/

[PruneCruft]
[MetaYAML]
[MetaJSON]
[Manifest]
[MakeMaker]
[ExecDir]
dir = script

[MetaResources]
homepage = https://github.com/oodler577/pvim
repository.type = git
repository.url = git@github.com:oodler577/pvim.git
repository.web = https://github.com/oodler577/pvim
bugtracker.web = https://github.com/oodler577/pvim/issues

[MetaNoIndex]
directory = inc
directory = t
directory = tools
directory = docs

[Prereqs / RuntimeRequires]
perl = 5.010
Digest::SHA = 0
Errno = 0
File::Basename = 0
File::Spec = 0
File::Temp = 0
Getopt::Long = 0
IO::Select = 0
Pod::Usage = 0
POSIX = 0

[Prereqs / TestRequires]
Test::More = 0.88
File::Temp = 0
Config = 0
FindBin = 0

[Prereqs / DevelopRequires]
IO::Pty = 1.12
JSON::PP = 0
Test::More = 0.98
Dist::Zilla = 6.000
Pod::Checker = 0
Pod::Text = 0
Archive::Tar = 0

; Only invoked by an intentional future dzil release, never by CI/build/test.
[TestRelease]
[ConfirmRelease]
[UploadToCPAN]
