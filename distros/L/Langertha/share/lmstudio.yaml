openapi: 3.1.0
info:
  title: LM Studio Native REST API
  version: 1.0.0
  description: |
    Minimal OpenAPI description for LM Studio native endpoints used by Langertha.
servers:
  - url: http://localhost:1234
    description: LM Studio local server
paths:
  /api/v1/chat:
    post:
      operationId: chat
      summary: Generate a chat response (optionally streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - input
              properties:
                model:
                  type: string
                input:
                  description: >-
                    One user turn: text, or an array of content parts (no roles,
                    no assistant messages; continue a conversation with
                    previous_response_id)
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: object
                        required:
                          - type
                        properties:
                          type:
                            type: string
                            enum:
                              - text
                              - image
                          content:
                            type: string
                            description: Text of a text part
                          data_url:
                            type: string
                            description: Base64 data URL of an image part
                system_prompt:
                  type: string
                temperature:
                  type: number
                max_output_tokens:
                  type: integer
                context_length:
                  type: integer
                stream:
                  type: boolean
                store:
                  type: boolean
                  description: Store the chat server-side and return a response_id (server default true)
                previous_response_id:
                  type: string
                  description: response_id of a stored chat to continue from
      responses:
        '200':
          description: Chat response
  /api/v1/models:
    get:
      operationId: listModels
      summary: List locally available models
      responses:
        '200':
          description: Model list
