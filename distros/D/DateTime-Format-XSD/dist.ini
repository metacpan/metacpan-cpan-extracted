name    = DateTime-Format-XSD
abstract = DateTime::Format::XSD - Format DateTime according to xsd:dateTime
;author  = Daniel Ruoso <daniel@ruoso.com>
author  = Timothy Legge <timlegge@gmail.com>
copyright_holder = Daniel Ruoso
; [...]
license = Perl_5
[Meta::Maintainers]
maintainer = Timothy Legge <timlegge@gmail.com>

[AutoPrereqs]
[Prereqs / RuntimeRequires]
perl = 5.008
DateTime::Format::ISO8601 = 0.19

[PruneCruft]
[ManifestSkip]
skipfile=MANIFEST.SKIP
[MetaYAML]
[License]
[Pod2Readme]
[ExtraTests]
[ExecDir]
[ShareDir]
[MakeMaker]
[TestRelease]
[ConfirmRelease]
[Manifest]
[GatherDir]
exclude_filename = cpanfile
exclude_filename = Makefile.PL
exclude_filename = MANIFEST
exclude_filename = README

[Encoding]
encoding = bytes
match = ico

[CPANFile]

[CopyFilesFromBuild::Filtered]
copy = cpanfile
copy = Makefile.PL
copy = README
copy = SECURITY.md

[CopyFilesFromRelease]
copy = SECURITY.md cpanfile, Makefile.PL, README

[MetaJSON]
[MetaProvides::Package]

[Repository]
git_remote = origin
[Bugtracker]
web = https://github.com/perl-net-saml2/perl-DateTime-Format-XSD/issues

[SecurityPolicy]
-policy = Individual
timeframe = 2 weeks

[PodSyntaxTests]
[PodCoverageTests]
[Test::Perl::Critic]
[Test::EOL]
[Test::EOF]
[Test::NoTabs]
[Test::TrailingSpace ]

[PodWeaver]
[AuthorsFromGit]

[NextRelease]
format = %v -- %{EEE MMM dd HH:mm:ss VVV yyyy}d
filename = Changes

[Git::NextVersion]
first_version = 0.5       ; this is the default
version_by_branch = 0       ; this is the default
version_regexp  = ^(0.\d+)$   ; this is the default
[OurPkgVersion]
[WriteVersion]

[Git::Tag]
tag_format  = %V       ; this is the default
tag_message = %V       ; this is the default

[Git::Commit]
changelog = Changes      ; this is the default

[SigStore::SignRelease]
