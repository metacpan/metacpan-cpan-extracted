name    = Log-Log4perl-Appender-OpenTelemetry
author  = Alexander Hartmaier <alex@hartmaier.priv.at>
license = Perl_5
copyright_holder = Alexander Hartmaier
copyright_year   = 2026

version = 0.001000

[@Filter]
-bundle = @Basic
-remove = ExtraTests
-remove = PruneCruft

[GatherFile]
filename = .perlcriticrc

[PruneCruft]
except = \.perlcriticrc

[PodWeaver]
[PkgVersion]
use_package = 1

[NextRelease]
[MetaConfig]
[MetaJSON]

[@TestingMania]
critic_config = .perlcriticrc

[RunExtraTests]

[@Git]
commit_msg  = version %v%n%n%c
tag_format  = %v
tag_message = %v

[MetaResources]
bugtracker.web = https://github.com/abraxxa/Log-Log4perl-Appender-OpenTelemetry/issues
repository.web = https://github.com/abraxxa/Log-Log4perl-Appender-OpenTelemetry
repository.url = https://github.com/abraxxa/Log-Log4perl-Appender-OpenTelemetry.git
repository.type = git

[Prereqs::FromCPANfile]
