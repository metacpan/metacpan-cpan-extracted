apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: knobs.opts.example.com
spec:
  group: opts.example.com
  scope: Namespaced
  names:
    kind: Knob
    plural: knobs
    singular: knob
    shortNames: [kn]
  versions:
    - name: v1alpha1
      served: true
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                mode:
                  type: string
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  description: Operating mode.
                  enum: [fast, safe]
                  default: safe
                replicas:
                  type: integer
                  minimum: 0
                  maximum: 5
                limit:
                  type: object
                  description: Rate limit applied to the knob.
                  properties:
                    average:
                      type: integer
                      minimum: 0
                    period:
                      type: string
                      pattern: '^[0-9]+[smh]$'
                routes:
                  type: array
                  items:
                    type: object
                    required: [match]
                    properties:
                      match:
                        type: string
                      weight:
                        type: integer
                size:
                  x-kubernetes-int-or-string: true
                extra:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                ready:
                  type: boolean
    - name: v0
      served: false
      storage: false
      schema:
        openAPIV3Schema:
          type: object
