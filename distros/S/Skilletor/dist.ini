name    = Skilletor
author  = Torsten Raudssus <torsten@raudssus.de>
license = Artistic_2_0
copyright_holder = Torsten Raudssus <torsten@raudssus.de> L<https://raudssus.de/>
copyright_year   = 2026
main_module = lib/Skilletor.pm

; Getty release command:
;   dzil release
; The [@Author::GETTY] bundle owns the release: the version is $VERSION in lib/ (x.yyyzzz is the
; plugin's x.y.z, package.json: 0.008000 is 0.8.0, and the bump after it 0.008001), Changes is
; stamped from {{$NEXT}}, the tag is the bare version, and the GitHub release triggers
; .github/workflows/binaries.yml.
;
; The repository root is the skilletor plugin too: its starter bin/, the TypeScript engine and
; everything Node, skills, docs and the shared conformance cases stay out of the CPAN tarball;
; t/ skips the parity and conformance tests without them. The dotfiles ship, as the bundle has
; it: the agent and CI files (.claude/, .github/, CLAUDE.md) and the plugin manifests
; (.claude-plugin/, .codex-plugin/), which the house counts among them.

[@Author::GETTY]
gather_exclude_match = ^bin/
gather_exclude_match = ^src/
gather_exclude_match = ^test/
gather_exclude_match = ^dist/
gather_exclude_match = ^node_modules/
gather_exclude_match = ^hooks/
gather_exclude_match = ^hermes/
gather_exclude_match = ^skills/
gather_exclude_match = ^docs/
gather_exclude_match = ^evals/
gather_exclude_match = ^assets/
gather_exclude_match = ^winlaunch/
gather_exclude_match = ^conformance/
gather_exclude_match = ^maint/
gather_exclude_match = ^scripts/[^/]+\.m?[jt]s$
gather_exclude_filename = package.json
gather_exclude_filename = package-lock.json
gather_exclude_filename = tsconfig.json
gather_exclude_filename = install.sh
; The release gate of the one version line: package.json must be the version released.
run_before_release = %x maint/version-tie.pl %v

; The standalone binary of script/skilletor, packed with pp after every dzil build and, per
; platform, by the bundle's dzil-binary workflow (.github/workflows/binaries.yml), which attaches
; skilletor-<VERSION>-<PLATFORM> and SHA256SUMS to the GitHub release. binary_pp_args computes the
; -M and -X sets from a live run (scripts/loaded-modules.pl, scripts/left-out-modules.pl);
; binary_require is what the workflow checks inside every binary: what skilletor loads by name.
binary           = skilletor
binary_default   = 0
binary_platforms = linux-x86_64 linux-arm64 macos-arm64 windows-x86_64
binary_prepare   = scripts/binary-prepare.sh
binary_pp_args   = scripts/binary-pp-args.sh
binary_verify    = scripts/binary-verify.sh
binary_smoke     = scripts/binary-smoke.sh
binary_require   = Skilletor::Source::Url Skilletor::Source::Git Skilletor::Source::Local
binary_require   = Skilletor::Render Text::Nunjucks
binary_require   = HTTP::Tiny IO::Socket::SSL Net::SSLeay Mozilla::CA

[@Author::GETTY::Binary / skilletor]
script = script/skilletor

; @Basic's ExecDir takes bin/, the plugin's starter, which is not gathered: the CPAN script is
; script/skilletor (EXE_FILES, :PerlExecFiles).
[ExecDir / ScriptDir]
dir = script
