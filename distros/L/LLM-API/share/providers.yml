# Curated standard on-demand pricing in USD. Updated 2026-11-04.
# Each token rate is [price in USD, number of tokens], expressed as a YAML sequence.
# Cached input, batch, priority, long-context, and modality-specific rates are not modeled.
# Sources:
#   https://aws.amazon.com/bedrock/pricing/
#   https://aws.amazon.com/blogs/machine-learning/prompting-for-the-best-price-performance/
#   https://platform.claude.com/docs/en/about-claude/pricing
# Bedrock geographic Claude profiles have a 10% premium over global profiles.
providers:
  bedrock:
    class: LLM::API::Bedrock
    models:
      'amazon.nova-micro-v1:0':
        input_tokens:
          - 0.035
          - 1000000
        output_tokens:
          - 0.14
          - 1000000
