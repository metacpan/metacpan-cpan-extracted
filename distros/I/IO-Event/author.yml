---
pod_spelling_system:
  skip: 0
  # list of words that are spelled correctly
  # (regardless of what spell check thinks)
  stopwords:
    - autoread
    - autoreading
    - cb
    - reentrant
    - Sharnoff

pod_coverage:
  skip: 0
  # format is "Class#method" or "Class", regex allowed
  # for either Class or method.
  private:
    - IO::Event::(Event|Emulate|AnyEvent)
    - IO::Event::Callback#ie_.*,handler,sock2handler
