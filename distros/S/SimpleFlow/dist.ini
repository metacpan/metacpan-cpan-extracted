[@Basic]
[VersionFromModule]
[MetaJSON]

; the "provides" map in META.yml/META.json: which module each package lives in,
; and at what version. CPANTS looks for it (meta_yml_has_provides), and PAUSE
; indexes from it rather than guessing by scanning the tarball.
[MetaProvides::Package]

; What lib/SimpleFlow.pm itself loads. "autodie" used to be here and is gone:
; the only thing that ever used it is md2pod.pl, which MANIFEST.SKIP keeps out
; of the distribution, so it was asking every installer for a module the
; shipped code never loads.
[Prereqs]
perl            = 5.010
Cwd             = 0
Data::Printer   = 0
Devel::Confess  = 0
; nothing "use"s it: DDP's show_memsize property, set at the top of the
; module, is what needs it, and DDP ignores the property without it
Devel::Size     = 0
Exporter        = 0
File::Spec      = 0
; for the capture files; task() captures on its own descriptors since 0.18
File::Temp      = 0
List::Util      = 0
POSIX           = 0
Scalar::Util    = 0
Time::HiRes     = 0

; Needed by t/ and by nothing that is installed, so they are not runtime
; prerequisites. Test::More is pinned at 0.96 because every test file uses
; subtest, which arrived in Test::Simple 0.94: perl 5.10.1 shipped 0.92, so a
; smoker with nothing but core would have failed to run the suite at all. The
; Makefile.PL dzil writes folds TEST_REQUIRES back into PREREQ_PM on
; ExtUtils::MakeMaker older than 6.63_03, so 5.10's toolchain still sees them.
[Prereqs / TestRequires]
Test::Exception = 0
Test::More      = 0.96

[MetaResources]
