name: binaries
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach; empty = probe run
        required: false
jobs:
  binaries:
    permissions:
      contents: write
    # The workflow and its scripts (bundle_ref) are pinned to one bundle commit: bundle main at
    # c339eef (2026-11-18), binary-v1 plus the fix that unpacks the probe's tarball outside the
    # dist checkout. uses: and bundle_ref: move together.
    uses: Getty/p5-dist-zilla-pluginbundle-author-getty/.github/workflows/dzil-binary.yml@c339eef236d6ef182205d4235128a72920a90756
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      bundle_ref: c339eef236d6ef182205d4235128a72920a90756
