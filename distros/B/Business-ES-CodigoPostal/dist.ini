name    = Business-ES-CodigoPostal
author  = HDELGADO <hdelgado@cpan.org>
copyright_holder = HDELGADO
license = Perl_5

[Prereqs]
Class::XSAccessor = 1.19

; Municipios.pm lleva los datos en __DATA__ y pesa ~650 KB; no es codigo
; que revisar a mano, lo genera maint/gen-municipios.pl desde GeoNames.

[VersionFromModule]
module = Business::ES::CodigoPostal

[GatherDir]
exclude_filename = ignore.txt
exclude_match    = \~$

[PruneCruft]
[PruneFiles]
match = ^\.
match = ~$

[Manifest]
[ManifestSkip]

[MetaYAML]
[MetaJSON]
[License]
[MakeMaker]

[MetaTests]                 
[KwaliteeTests]             

[Test::UnusedVars]
[Test::Compile]   
[HasVersionTests]

[PodWeaver]

[PodSyntaxTests]
[PodCoverageTests]
[Test::PodSpelling]
[Test::EOL]
[Test::NoTabs]
