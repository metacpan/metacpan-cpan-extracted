name: dzil-perl-images

# Build and publish the dzil test images (see simpici-provider/dzil-perl/), one
# per version in simpici-provider/perl-versions: ghcr.io/getty/dzil-perl:<ver>.
# The SimpiCI provider's jobs run in them. They install the bundle from CPAN, so
# the weekly run picks up new releases of it, Dist::Zilla and their deps.
on:
  push:
    branches: [main]
    paths:
      - 'simpici-provider/dzil-perl/**'
      - 'simpici-provider/perl-versions'
      - '.github/workflows/dzil-perl-images.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      perl: ${{ steps.list.outputs.perl }}
    steps:
      - uses: actions/checkout@v7
      - name: Version matrix from perl-versions
        id: list
        run: |
          perl="$(jq -Rcn '[inputs | splits("\\s+") | select(length > 0)]' simpici-provider/perl-versions)"
          echo "perl=$perl" >> "$GITHUB_OUTPUT"
          echo "$perl"

  build:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ${{ fromJSON(needs.versions.outputs.perl) }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: simpici-provider/dzil-perl
          file: simpici-provider/dzil-perl/Containerfile
          build-args: PERL_VERSION=${{ matrix.perl }}
          pull: true
          # A manual run from another branch builds but does not publish.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/getty/dzil-perl:${{ matrix.perl }}
