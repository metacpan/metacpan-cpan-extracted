apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: utf8things.utf8.example.com
spec:
  group: utf8.example.com
  scope: Namespaced
  names:
    kind: Utf8Thing
    plural: utf8things
    singular: utf8thing
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                interval:
                  type: string
                  pattern: '^[0-9]+µs$'
                mode:
                  type: string
                  enum: [safe, µs]
                extra:
                  type: object
                  properties:
                    note:
                      type: string
                      description: "Note with a ü character in its description."
