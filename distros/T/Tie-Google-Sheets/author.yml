---
pod_spelling_system:
  skip: 0
  # list of words that are spelled correctly
  # (regardless of what spell check thinks)
  # or stuff that I like to spell incorrectly
  # intentionally
  stopwords:
    - A1
    - backoff
    - FIRSTKEY
    - NEXTKEY
    - TIEHASH
    - OAuth2
    - ua
    - doesn

pod_coverage:
  skip: 0
  # format is "Class#method" or "Class",regex allowed
  # for either Class or method.
  private:
    - 'Tie::Google::Sheets#BUILDARGS'
    - 'Tie::Google::Sheets::Client#BUILDARGS'
    - 'Tie::Google::Sheets::Client#DEMOLISH'
    - 'Tie::Google::Sheets::Worksheet#BUILDARGS'
