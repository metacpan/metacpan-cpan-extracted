name    = Skilletor
author  = Torsten Raudssus <getty@cpan.org>
license = Perl_5
copyright_holder = Torsten Raudssus <torsten@raudssus.de> L<https://raudssus.de/>
copyright_year   = 2026
main_module = lib/Skilletor.pm

; The Perl port of skilletor lives beside the TypeScript reference in src/ of the
; same repository. Run dzil from this directory.

[@Author::GETTY]
; maint/ holds the Node scripts that regenerate t/data/*-oracle.json from the
; reference in ../src and drive it in t/50-parity.t; they need the checkout, so they
; stay out of the CPAN tarball (t/50-parity.t skips without them).
gather_exclude_match = ^maint/
