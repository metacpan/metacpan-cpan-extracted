# ExternalSecrets CRD emitter overlay (D5/D6, k95 conventions, k120).
#
# Read by maint/crd-drift-check.pl --render/--check for --provider
# ExternalSecrets, at the pinned upstream_version (v2.10.0,
# github.com/external-secrets/external-secrets). `names` maps the logical
# path below each Kind (IO::K8s::AutoGen::class_path, e.g. Spec::Auth) to the
# bare upstream Go type name, which is the checked-in class name under the
# matching IO::K8s::ExternalSecrets version directory (D6).
#
# The generators.external-secrets.io/v1alpha1 Kinds deliberately embed types
# the v1 (external-secrets.io) generators already model -- an ECR/STS
# generator's auth is the very AWSAuth v1 ships, an ACR generator's
# serviceAccountRef the v1 ServiceAccountSelector -- rather than a v1alpha1
# copy. That is the k120 absolute-target mechanism: a `names` value carrying
# '::' is a fully-qualified cross-version package the emitter references
# ('+IO::K8s::ExternalSecrets::V1::AWSAuth') and does NOT emit a v1alpha1 file
# for. package_for used to prefix every overlay name with the current version
# base, which made such a target impossible; k120 lifts that for '::'-bearing
# values. A '::' value under IO::K8s::Api/Apimachinery (a core class) is
# referenced by its short prefix (Core::V1::X) the way a hand-written class
# writes it; any other '::' value keeps the full '+' form.
#
# Provenance: derived by walking each rendered Kind tree in lockstep with the
# checked-in lib tree and reading lib's own references as the naming oracle
# (the fields agree field-for-field -- the k120 schema audit found 0
# constraint differences), then verified with --check. It closes the
# STRUCTURAL half: 0 missing-in-lib. The residual --check DIFFERS are body
# formatting only (a contextual # ABSTRACT taken from the embedding field's
# description on a shared type, `=>` column alignment and hand-wrapped enums
# in a few hand-written files, extra explanatory POD) -- the lib-rewrite
# follow-up, not something this overlay can touch without editing lib.
#
# The one exception is the uuids generator, whose upstream .spec is a
# property-less {type: object}: AutoGen keeps a property-less object opaque
# (k55), so the render types UUID.spec (and ClusterGenerator's uuidSpec) as
# { Str => 1 } and emits no UUIDSpec, while lib ships a named empty UUIDSpec
# struct. That typed-empty vs opaque-hash divergence is outside every overlay
# mechanism; UUIDSpec.pm is carried in maint/crd-drift-exceptions.yaml's
# ignore_unrendered and the residual DIFFERS on those two files are noted for
# a follow-up decision.
