name = Web-Request
author = Jesse Luehrs <doy@tozt.net>
author = Paul Cochrane <paul@peateasea.de>
license = Perl_5
copyright_holder = Jesse Luehrs
copyright_year = 2012--2026

[AutoPrereqs]

[@Basic]

[Prereqs / TestMoreDoneTesting]
-phase = test
-type = requires
Test::More = 0.88

[MetaConfig]
[MetaJSON]

[NextRelease]
format = %-5v %{yyyy-MM-dd}d
[CheckChangesHasContent]
[PkgVersion]
[Authority]
authority = cpan:PTC

[PodCoverageTests]
[PodSyntaxTests]
[Test::NoTabs]
[Test::EOL]
[Test::Compile]
[MetaResources]
homepage          = http://metacpan.org/release/Web-Request
bugtracker.web    = https://github.com/paultcochrane/web-request/issues
repository.url    = git://github.com/paultcochrane/web-request.git
repository.web    = https://github.com/paultcochrane/web-request
repository.type   = git

[Git::Check]
allow_dirty =
[Git::Tag]
tag_format = %v
tag_message =
[Git::NextVersion]
version_regexp = ^(\d+\.\d+)$
first_version = 0.01

[PodWeaver]
[UploadToCPAN]
[MetaProvides::Package]

[Encoding]
encoding = bytes
filename = t/data/baybridge.jpg  ; this file is an image

[ContributorsFromGit]

[MetaNoIndex]
package = Web::Request::Types
