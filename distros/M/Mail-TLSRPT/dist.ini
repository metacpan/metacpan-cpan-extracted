name    = Mail-TLSRPT
author  = Jemma Bradshaw <jemma@nothingbutstatic.dev>
license = Perl_5
copyright_holder = Jemma Bradshaw
copyright_year   = 2026

[AutoVersion]
format = 2.{{ cldr('yyyyMMdd') }}
[OurPkgVersion]
[NextRelease]
format = %-9v %{yyyy-MM-dd VVVV}d

[AutoPrereqs]

[PodWeaver]
;[PodCoverageTests]
[PodSyntaxTests]

[ReadmeAnyFromPod]
type=markdown
filename=README.md

[@Git]
[Git::Contributors]
[Git::GatherDir]

[@Filter]
-bundle = @Basic
-remove = GatherDir
[MetaJSON]

[MetaResources]
bugtracker.web    = https://github.com/fastmail/mail-tls-rpt/issues
repository.url    = git://github.com/fastmail/mail-tls-rpt.git
repository.web    = https://github.com/fastmail/mail-tls-rpt
repository.type   = git

;[Test::Perl::Critic]
;critic_config = t/perlcriticrc

