; Canonical dist.ini skeleton. See ~/projects/Agents/DZIL_GUIDE.md.
name             = DBIx-QuickORM
author           = Chad Granum <exodist7@gmail.com>
license          = Perl_5
copyright_holder = Chad Granum

[RewriteVersion]   ; sets dist version from the main module's $VERSION
[License]
[ManifestSkip]
[Manifest]
[NextRelease]

[GatherDir]
exclude_match    = ^old
exclude_match    = ^worktrees
exclude_match    = ^reviews/          ; review-helper reviews, a worktree of their own
exclude_match    = ^agent_scripts/
exclude_match    = ^AI_DOCS/
exclude_match    = ^release-scripts
exclude_match    = ^demo
exclude_match    = ^cover              ; cover_db and friends
exclude_match    = ^nyt
exclude_match    = ^test-logs
exclude_match    = ^data/
exclude_match    = ^pt                 ; only run these tests locally
exclude_match    = ^tt                 ; only run these tests locally
exclude_match    = ^xt/downstream      ; only run these tests locally
exclude_match    = ^t/                 ; re-gathered below, to pick up dotfiles
exclude_match    = \.md$               ; internal docs never ship
exclude_filename = LICENSE
exclude_filename = Makefile.PL
exclude_filename = README
exclude_filename = README.md
exclude_filename = cpanfile
exclude_filename = cpanfile.ci
exclude_filename = TEMPLATE.pod
exclude_filename = .yath-persist.json

[PruneCruft]

; Re-gather t/ through Git so t/ dotfiles ship. One block per test root.
[Git::GatherDir / GatherDotFilesT]
root             = t/
prefix           = t/
include_dotfiles = 1

; The AI/LLM policy is the one internal .md that ships. Gathered back by name
; because the blanket \.md$ exclusion above is otherwise correct.
[GatherFile]
filename = AI_AND_LLM_POLICY.md

[PodSyntaxTests]
[TestRelease]
[Test::ChangesHasContent]

[MetaResources]
bugtracker.web  = https://github.com/exodist/DBIx-QuickORM/issues
repository.url  = https://github.com/exodist/DBIx-QuickORM/
repository.type = git

[Prereqs]
perl                      = 5.014000
Atomic::Pipe              = 0.033     ; forked queries
Cpanel::JSON::XS          = 3.0224
DateTime                  = 0
DateTime::Format::ISO8601 = 0
DateTime::Format::MySQL   = 0.08
DateTime::Format::Pg      = 0
DateTime::TimeZone        = 2.44      ; offset_as_string with a separator
DBD::SQLite               = 1.70      ; RETURNING, so one backend always works
DBI                       = 1.628
Importer                  = 0.026     ; the DSL's tags and renaming
Object::HashBase          = 0.016
Role::Tiny                = 2.000003
SQL::Abstract             = 2.000001
Storable                  = 0         ; Role::Type's default clone_inflated
UUID                      = 0.36

[Prereqs / RuntimeSuggests]
DBD::DuckDB             = 0
DBD::MariaDB            = 0
DBD::Pg                 = 0

[Prereqs / TestRequires]
DateTime::Format::Strptime = 0
Test2::Tools::QuickDB      = 0.000066
Test2::V0                  = 0.000060

[Prereqs / ConfigureRequires]
ExtUtils::MakeMaker = 0

[Prereqs / DevelopRequires]
DBD::DuckDB             = 0
DBD::MariaDB            = 0
DBD::Pg                 = 0

[MakeMaker]

[CPANFile]
[MetaYAML]
[MetaJSON]

; authordep Pod::Markdown
[ReadmeFromPod / Markdown]
filename = lib/DBIx/QuickORM.pm
type     = markdown
readme   = README.md

[ReadmeFromPod / Text]
filename = lib/DBIx/QuickORM.pm
type     = text
readme   = README

[CopyFilesFromBuild]
copy = LICENSE
copy = cpanfile
copy = README
copy = README.md
copy = Makefile.PL

[Git::Check]
allow_dirty = Makefile.PL
allow_dirty = README
allow_dirty = README.md
allow_dirty = cpanfile
allow_dirty = LICENSE
allow_dirty = Changes

[Git::Commit]
allow_dirty = Makefile.PL
allow_dirty = README
allow_dirty = README.md
allow_dirty = cpanfile
allow_dirty = LICENSE
allow_dirty = Changes

[Git::Tag]

; Releases are manual: build, test, tag, bump -- but never upload.
[FakeRelease]

[BumpVersionAfterRelease]

[Git::Commit / Commit_Changes]
munge_makefile_pl = true
allow_dirty_match = ^lib
allow_dirty_match = ^scripts
allow_dirty       = Makefile.PL
allow_dirty       = README
allow_dirty       = README.md
allow_dirty       = cpanfile
allow_dirty       = LICENSE
commit_msg        = Automated Version Bump
