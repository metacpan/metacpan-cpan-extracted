name          = DBIO
author        = DBIx::Class & DBIO Contributors (see AUTHORS file)
license       = Perl_5
copyright_year = 2005

[@DBIO]
core = 1
heritage = 1
share_skill = dbio-core
share_skill = dbio-coordination
share_skill = dbio-driver-development
share_skill = dbio-perl-syntax
share_skill = dbio-perl-class-patterns
share_skill = dbio-perl-pod
share_skill = dbio-moo-moose
share_skill = dbio-adr
share_skill = dbio-codeberg-user-issues
share_skill = dbio-consolidate-release

; The karr skills (kanban-issues-karr-coordination, kanban-issues-karr-ticket)
; live in the karr tool itself,
; not in any DBIO repo — see the skill's "each shipped by exactly ONE dist"
; rule. Therefore not declared as a share_skill here.

[MetaNoIndex]
; All internal test helpers - these are only used by dbio's own test
; suite and should not show up on CPAN search. Real public test
; facilities are intentionally left indexed, because the driver dists
; use them and must be able to name them: DBIO::Test, DBIO::Test::Storage,
; DBIO::Test::Util, DBIO::Test::Cursor, DBIO::Test::BaseResult,
; DBIO::Test::BaseResultSet, DBIO::Test::DateTimeParser,
; DBIO::Test::Kubernetes, DBIO::Test::StorageLayer (the ADR 0032 s7
; structural check, used by four driver dists in their t/00-load.t),
; DBIO::Test::AsyncHarness (the live-harness base the EV transports
; inherit from), DBIO::Test::Conformance with DBIO::Test::Conformance::Cases::DDL, ::Diff and
; ::Bind (the shared case table runner and its lists, which the drivers
; subclass and run), DBIO::Test::AsyncParity with DBIO::Test::AsyncParity::Cases (the
; sync/async parity case table the transports run with their harness), and
; DBIO::Test::Future (the manually settled helper for deterministic core
; async tests).
namespace = DBIO::Test::Namespace
namespace = DBIO::Test::Schema
namespace = DBIO::Test::DeployComponent
namespace = DBIO::Test::ErrorComponent
namespace = DBIO::Test::FakeComponent
namespace = DBIO::Test::ForeignComponent
namespace = DBIO::Test::OptionalComponent
namespace = DBIO::Test::ResultSetManager
namespace = DBIO::Test::SyntaxErrorComponent1
namespace = DBIO::Test::SyntaxErrorComponent2
namespace = DBIO::Test::SyntaxErrorComponent3
namespace = DBIO::Test::Taint
namespace = DBIO::Test::DynamicForeignCols
package   = DBIO::Test::Storage::FakeSth
package   = DBIO::Test::Storage::FakeCursor
package   = DBIO::Test::Storage::FakeDbh
