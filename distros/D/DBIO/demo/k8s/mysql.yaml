# MySQL for the DBIO demo (see demo/README).
#
# RESOURCE DISCIPLINE — this may well run on a small SHARED box (few cores,
# alongside other DBs and services). The pod carries resources.limits so it can
# never starve the host. Bring up ONE demo DB at a time and DELETE it when done
# (`kubectl delete -f demo/k8s/`) — a forgotten pod is capped but still noise.
# See the RESOURCE LIMITS section of DBIO::Test::Kubernetes, and the "Live
# testing" section in .claude/rules/dbio-rules.md.
---
apiVersion: v1
kind: Service
metadata:
  name: dbio-demo-mysql
  labels:
    app: dbio-demo-mysql
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: dbio-demo-mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbio-demo-mysql
  labels:
    app: dbio-demo-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dbio-demo-mysql
  template:
    metadata:
      labels:
        app: dbio-demo-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          resources:
            requests:
              cpu: 250m
              memory: 384Mi   # mysqld's baseline RSS; understating it invites overcommit
            limits:
              cpu: "1"          # at most one core on a shared box
              memory: 1Gi
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: dbio_demo
            - name: MYSQL_USER
              value: dbio
            - name: MYSQL_PASSWORD
              value: dbio
            - name: MYSQL_ROOT_PASSWORD
              value: dbio-root
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-u", "dbio", "-pdbio"]
            initialDelaySeconds: 10
            periodSeconds: 5
