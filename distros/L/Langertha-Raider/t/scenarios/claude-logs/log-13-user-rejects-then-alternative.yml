# Real pattern: in default mode the person rejects a Bash call ("The user doesn't
# want to proceed with this tool use"); the model does not repeat it, it asks
# what to do instead (AskUserQuestion), takes the answer and goes the other way.
# The refusal is Claude Code's "doesn't want to proceed" text with the reason the
# person gave. Abweichung: Claude Code also has an interrupt note for a person
# who pressed Esc; raider's question has no such answer.
title: the person refuses a command, the model asks what to do instead and follows the answer
permission_mode: default
approve: [ "no: not in this directory", once ]
ask: [ "Write a script file" ]
files:
  notes.txt: "x\n"
prompt: Generate the build file.
script:
  - tool_calls:
      - [ bash, { command: "echo build > Makefile" } ]
  - tool_calls:
      - [ ask_user, { question: 'How should I create the build file?', options: [ 'Write a script file', 'Skip it' ] } ]
  - tool_calls:
      - [ write_file, { path: build.sh, content: "echo build\n" } ]
  - text: Created build.sh instead of a Makefile.
expect:
  answer: Created build.sh instead of a Makefile.
  absent: [ Makefile ]
  files:
    build.sh: "echo build\n"
  questions:
    - { question: 'How should I create the build file?', options: [ 'Write a script file', 'Skip it' ] }
  permissions:
    - { tool: bash }
    - { tool: write_file }
  tools:
    - { name: bash, error: true, text: "^The user doesn't want to proceed with this tool use\\. The tool use was rejected \\(eg\\. if it was a file edit, the new_string was NOT written to the file\\)\\. To tell you how to proceed, the user said:\nnot in this directory$" }
    - { name: ask_user, text: '^User answered: Write a script file$' }
    - { name: write_file }
  events:
    - { type: permission.denied, tool: bash, by: user }
