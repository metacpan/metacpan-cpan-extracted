---
config:
  dedup: 1
  test_empty: 1
  test_non_ascii: 0
  test_nuls: 0
  test_undef: 0
function: new
module: HTML::OSM
output:
  isa: HTML::OSM
  type: object

input:
  zoom:
    type: integer
    min: 0
    max: 19
    optional: true
  height:
    type: string
    optional: true
  width:
    type: string
    optional: true
  min_interval:
    type: number
    min: 0
    optional: true
  tile_url:
    type: string
    optional: true
  tile_attribution:
    type: string
    optional: true
  email:
    type: string
    optional: true
  max_zoom:
    type: integer
    min: 0
    max: 28
    optional: true
  search:
    type: boolean
    optional: true
  scale:
    type: boolean
    optional: true
  legend_title:
    type: string
    optional: true
  legend_empty:
    type: string
    optional: true
  fit:
    type: boolean
    optional: true
  legend_position:
    type: string
    enum:
      - topright
      - topleft
      - bottomright
      - bottomleft
    optional: true
