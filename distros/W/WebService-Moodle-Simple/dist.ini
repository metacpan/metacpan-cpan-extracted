name     = WebService-Moodle-Simple
author   = Andrew Solomon <andrew@geekuni.com>
license  = Perl_5
copyright_holder = Andrew Solomon
copyright_year   = 2014
[@Basic]
; development-only files, not for CPAN
[PruneFiles]
filename = AGENTS.md
match = ^docs/
[MinimumPerl]
[MetaProvides::Class]
[MetaProvides::Package]
[AutoPrereqs]
; authordep Pod::Weaver::Section::ClassMopper
; authordep Pod::Weaver::Section::Contributors
[@Git]
[GithubMeta]
[NextRelease]
format = %-5v %{yyyy-MM-dd HH:mm:ss}d UTC
time_zone = UTC
[Git::NextVersion]
version_regexp = ^v?(\d+\.\d+)$
[PodWeaver]
finder = :InstallModules
[Git::Contributors]
[PkgVersion]
[ReadmeAnyFromPod / pod.root ]
    filename = README.pod
    type = pod
    location = root
