name    = Skilletor
author  = Torsten Raudssus <torsten@raudssus.de>
license = Artistic_2_0
copyright_holder = Torsten Raudssus <torsten@raudssus.de> L<https://raudssus.de/>
copyright_year   = 2026
main_module = lib/Skilletor.pm

; Getty release command:
;   dzil release
; Farewell release, as App-Briefing 0.007000 did it: skilletor's Perl port is retired, and the
; tarball carries the 62 modules of 0.008000 as empty stubs, script/skilletor as a stub that
; prints the notice, their test t/00-stubs.t and the distribution metadata only. Skilletor
; names the replacement. The version is $VERSION in lib/ (x.yyyzzz is the plugin's x.y.z,
; package.json: 0.009000 is 0.9.0), Changes is stamped from {{$NEXT}}, the tag is the bare
; version. No binaries: the GitHub release gets none.
;
; The repository root is the skilletor plugin too, and its files stay in the repository: the
; dotfiles (.claude/, .claude-plugin/, .codex-plugin/, .github/, ...) stay out of the gathering,
; @Filter drops the bundle's agent-context snapshot, and PruneFiles takes out everything else
; that is not the dist. Through @Filter the bundle takes no list-valued key (its gather_exclude_*
; and run_* keys would fail their type check), so the plugin tree is pruned below, not excluded
; from the gathering, and the version tie runs from its own Run::BeforeRelease.
[@Filter]
-bundle = @Author::GETTY
-remove = GatherAgentContext
gather_include_dotfiles = 0

[PruneFiles]
match = ^assets/
match = ^bin/
match = ^conformance/
match = ^dist/
match = ^docs/
match = ^evals/
match = ^hermes/
match = ^hooks/
match = ^maint/
match = ^scripts/
match = ^skills/
match = ^src/
match = ^test/
match = ^winlaunch/
filename = CLAUDE.md
filename = install.sh
filename = package-lock.json
filename = package.json
filename = tsconfig.json

; The release gate of the one version line: package.json must be the version released.
[Run::BeforeRelease / VersionTie]
run = %x maint/version-tie.pl %v

; @Basic's ExecDir takes bin/, the plugin's starter, which is pruned: the CPAN script is
; script/skilletor (EXE_FILES, :PerlExecFiles), so the upgrade also replaces the program and its
; man page of 0.008000.
[ExecDir / ScriptDir]
dir = script
