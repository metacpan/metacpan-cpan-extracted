# Cilium CRD emitter overlay (D5/D6, k95, task B-Cilium).
#
# Read by maint/crd-drift-check.pl --render/--check for --provider Cilium.
# `kinds` is keyed by bare Kind name -- NOT by version -- because the SAME
# Kind name is served by both cilium.io/v2 and cilium.io/v2alpha1 for a
# handful of BGP/CIDR/LoadBalancer Kinds (see lib/IO/K8s/Cilium.pm's
# back-compat resource_map keys, k78/k83); render_gvk() picks `base` per
# served version automatically, so one overlay entry covers both. This file
# is filled in two passes matching the two-commit task split: cilium.io/v2
# Kinds first, cilium.io/v2alpha1-only Kinds (CiliumDatapathPlugin,
# CiliumEndpointSlice, CiliumGatewayClassConfig, CiliumL2AnnouncementPolicy,
# CiliumPodIPPool) appended in the second commit.
#
# `names` maps the logical path below each Kind (what
# IO::K8s::AutoGen::class_path returns) to the upstream Go type name at the
# pinned upstream_version (v1.20.1, github.com/cilium/cilium):
#   pkg/policy/api/{rule,egress,ingress,l4,http,icmp,cidr,fqdn,groups,
#   selector,service}.go -- the shared Rule family (Rule, EndpointSelector,
#   IngressRule/EgressRule, IngressDenyRule/EgressDenyRule, PortRule,
#   PortDenyRule, CIDRRule, FQDNSelector, ...). CiliumNetworkPolicy and
#   CiliumClusterwideNetworkPolicy embed the LITERAL SAME api.Rule at both
#   `spec` (single Rule) and `specs` (Rule[]) -- verified byte-identical
#   schema for both fields between the two Kinds before writing this file --
#   so every Rule-family path is mapped to the SAME bare name at all four
#   prefixes (CNP Spec::, CNP SpecsItem::, CCNP Spec::, CCNP SpecsItem::):
#   one class per version directory, proven by --check MATCH plus
#   t/07_cilium.t's "same Rule class" assertion.
#   pkg/k8s/apis/cilium.io/v2/*.go -- the per-Kind CRD wrapper types
#   (CiliumBGPAdvertisementSpec, CiliumNetworkPolicyStatus,
#   CiliumNetworkPolicyNodeStatus, NodeSpec/NodeStatus, EndpointStatus, ...).
#   pkg/aws/types, pkg/azure/types, pkg/alibabacloud/types, pkg/ipam/types,
#   api/v1/models -- CiliumNode's per-cloud-provider ENI/IPAM subtrees and
#   CiliumEndpoint's status subtree (EndpointHealth, EndpointIdentifiers,
#   ControllerStatus*, IdentityTuple, ...).
#
# Three deliberate deviations from the literal upstream Go name, each
# because the literal name COLLIDES with an unrelated type already claiming
# it elsewhere in this same cilium.io/v2 overlay (overlay `names` values are
# bare package names under one shared `base` per version directory, so two
# different upstream Go types that happen to share a bare name in different
# Go packages would otherwise silently alias into ONE Perl class):
#   - cegp_types.go's own `EgressRule` (CiliumEgressGatewayPolicy's
#     {namespaceSelector,podSelector,nodeSelector} selector triple) would
#     collide with policy/api.EgressRule (the Rule family's egress rule,
#     used pervasively by CNP/CCNP) -> named `EgressGatewaySelector`.
#   - cec_types.go's own `Service` (CiliumEnvoyConfig's
#     {name,namespace,ports} backend-service reference) would collide with
#     policy/api.Service (the Rule family's k8s-service policy target) ->
#     named `EnvoyConfigService`.
#   - alibabaCloudTypes' `Spec`/`ENIStatus`/`ENI` (CiliumNode's Alibaba
#     Cloud subtree) would collide with a bare "Spec" being a useless class
#     name on its own, and ENIStatus/ENI collide outright with the AWS
#     subtree's own (correctly bare) `ENIStatus`/`ENI` -> named
#     `AlibabaCloudSpec`/`AlibabaCloudENIStatus`/`AlibabaCloudENI`, mirroring
#     the AWS/Azure siblings' own already-qualified names
#     (`ENISpec`/`AzureSpec`, `AwsVPC`/`VPC`).
#
# CiliumEndpoint, CiliumIdentity and CiliumEndpointSlice (v2alpha1, second
# commit) are NOT reachable through maint/crd-drift-check.pl's own
# --render/--check pipeline without tripping k107 (filed): its
# parse_crds() reads `$schema->{properties}{spec}{properties}` to decide
# has_spec_schema, which autovivifies an empty `properties.spec => {}` into
# the shared manifest doc for any Kind that has NO `spec` property at all --
# exactly these three. The corrupted doc then makes IO::K8s::CRD->generate
# emit a bogus `k8s spec => Str;` attribute nothing upstream declares. These
# three Kinds' checked-in files were rendered with the SAME emitter and this
# SAME overlay via a bug-free direct call (IO::K8s::CRD->generate on the
# manifest read straight off disk, bypassing crd-drift-check.pl's parse_crds
# entirely) and are otherwise byte-identical emitter output; `--check` is
# expected to report DIFFERS for exactly these three files (extra phantom
# `spec` line + POD), documented in the task report rather than worked
# around by shipping the invented field.
#
# `with`/`extra` are copied verbatim from the opaque roots this overlay
# replaces, only where they differ from the emitter's own default (Namespaced
# iff the CRD scope says so): CiliumNetworkPolicy and
# CiliumClusterwideNetworkPolicy compose IO::K8s::Role::NetworkPolicy and
# keep `sub _netpol_format { 'cilium' }` verbatim.
kinds:
  CiliumBGPAdvertisement:
    names:
      Spec: CiliumBGPAdvertisementSpec
      Spec::AdvertisementsItem: BGPAdvertisement
      Spec::AdvertisementsItem::Attributes: BGPAttributes
      Spec::AdvertisementsItem::Attributes::Communities: BGPCommunities
