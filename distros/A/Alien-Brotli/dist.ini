name = Alien-Brotli
author  = Robert Rothenberg <perl@rhizomnic.com>
author  = Michal Josef Špaček <michal.josef.spacek@gmail.com>
license = MIT
copyright_holder = Robert Rothenberg
copyright_year   = 2022, 2026

[Keywords]
keyword = brotli
keyword = libbrotli

[AlienBuild]
[GatherDir]
exclude_match = cpanfile*
exclude_filename = LICENSE
exclude_filename = SECURITY.md
exclude_filename = doap.xml
prune_directory = ^local
prune_directory = ^_alien
[PruneCruft]
[CPANFile]
[License]
[DOAP]
[ExecDir]
[ShareDir]
[MakeMaker]
[Manifest]
[TestRelease]
[ConfirmRelease]
[CheckExtraTests]
[SigStore::SignRelease]

[RecommendedPrereqs]
[AutoPrereqs]
[Prereqs / Build]
-phase = build
Alien::bc::GNU = 0
Alien::cmake3 = 0
Alien::Build::Plugin::Probe::CommandLine = 0
Env::ShellWords = 0
ExtUtils::MakeMaker = 7.22
Module::Metadata = 1.000015

[Prereqs / Test]
-phase = test
Test::Alien::Diag = 2.68

; [EnsurePrereqsInstalled]
; :version = 0.003
; type = requires
; type = recommends

[GitHub::Meta]
repo = git://github.com/robrwo/perl-Alien-Brotli.git

[SecurityPolicy]
; authordep Software::Security::Policy::Individual
-policy = Individual
-policy_version = 0.10
timeframe = two weeks
git_url =  https://github.com/robrwo/perl-Alien-Brotli/
report_url = https://github.com/robrwo/perl-Alien-Brotli/security/advisories

[PodWeaver]
; authordep Pod::Weaver::Plugin::AppendPrepend
; authordep Pod::Weaver::Section::Contributors
; authordep Pod::Weaver::Section::SourceGitHub
[UsefulReadme]
type     = gfm
filename = README.md
location = build

[CopyFilesFromBuild]
copy = LICENSE
copy = README.md
copy = cpanfile
copy = doap.xml

[PruneFiles]
match = ^_alien/
match = ~$

[Metadata]
x_authority    = cpan:RRWO

[MetaProvides::Package]
[MetaJSON]
[MetaYAML]

[InstallGuide]

; authordep Pod::Weaver::Plugin::AppendPrepend
; authordep Pod::Weaver::Section::Contributors
; authordep Pod::Weaver::Section::SourceGitHub

[PodSyntaxTests]
[Test::DistManifest]
; authordep Test::DistManifest
[Test::CleanNamespaces]
; authordep Test::CleanNamespaces
[Test::EOF]
; authordep Test::EOF
[Test::EOL]
:version = 0.14
[Test::Fixme]
;; [Test::MinimumVersion]

[Test::NoTabs]
;;[Test::Perl::Critic]
;;critic_config = xt/etc/perlcritic.rc

[Test::Pod::Coverage::Configurable]
[Test::Pod::LinkCheck]
[Test::Portability]
[Test::TrailingSpace]
; authordep Test::TrailingSpace
filename_regex = \.(?:p[lm]|pod)\z
;;[Test::Kwalitee]
;;skiptest = use_strict
[Test::ReportPrereqs]
:version = 0.022
version_extractor = Module::Metadata
verify_prereqs = 1

[Test::PodSpelling]
[MojibakeTests]
[Test::MixedScripts]
; authordep Test::MixedScripts

[Test::CPAN::Changes]
; authordep Test::CPAN::Changes

[Test::UnusedVars]
[MetaTests]

;; [Test::Version]
[Test::Compile]
; authordep Test::Compile
filename = xt/00-compile.t

[Test::CVE]
;; -skip = xt/etc/cve.skip

[@Git]
allow_dirty = dist.ini
push_to     = origin main:main
tag_format  = %v
commit_msg  = %v%n%n%c

[Git::Contributors]
:version = 0.019

[RewriteVersion]
[NextRelease]
[BumpVersionAfterRelease]

[Git::Commit / Commit_Changes] ; commit Changes (for new dev)
allow_dirty_match = ^lib/
commit_msg = Commit Changes and bump $VERSION
