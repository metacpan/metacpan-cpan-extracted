<text x="48" y="128" textLength="45" fill="#61afef">[ ON]</text>
<text x="102" y="128" textLength="45" fill="#dcdfe4">Wi-Fi</text>
<text x="48" y="164" textLength="45" fill="#61afef">[ ON]</text>
<text x="102" y="164" textLength="81" fill="#dcdfe4">Bluetooth</text>
<text x="48" y="200" textLength="171" fill="#dcdfe4">[OFF] Airplane mode</text>
<text x="48" y="236" textLength="189" fill="#96a0b4">Bluetooth switched on</text>
