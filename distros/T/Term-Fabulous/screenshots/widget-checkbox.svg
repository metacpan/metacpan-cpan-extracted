<svg xmlns="http://www.w3.org/2000/svg" width="600" height="219" viewBox="0 0 600 219" role="img" aria-label="perl examples/widgets/checkbox.pl">
<title>perl examples/widgets/checkbox.pl</title>
<style>
.terminal text { font-family: 'JetBrains Mono', 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-size: 15px; white-space: pre; }
.terminal .b { font-weight: bold; }
.terminal .i { font-style: italic; }
.title { font-family: 'JetBrains Mono', 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-size: 13px; }
</style>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/></filter>
<clipPath id="window"><rect x="16" y="16" width="568" height="184" rx="10"/></clipPath>
</defs>
<rect x="16" y="16" width="568" height="184" rx="10" fill="#161622" filter="url(#shadow)"/>
<rect x="16" y="16" width="568" height="34" fill="#1f2430" clip-path="url(#window)"/>
<circle cx="36" cy="33" r="6" fill="#ff5f57"/>
<circle cx="56" cy="33" r="6" fill="#febc2e"/>
<circle cx="76" cy="33" r="6" fill="#28c840"/>
<text class="title" x="300" y="33" text-anchor="middle" dominant-baseline="central" fill="#9aa3b5">perl examples/widgets/checkbox.pl</text>
<rect x="16.5" y="16.5" width="567" height="183" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
<g shape-rendering="crispEdges">
<rect x="183" y="78" width="135" height="18" fill="#343a48"/>
</g>
<g class="terminal">
<text x="48" y="92" textLength="63" fill="#96a0b4">focused</text>
<text x="183" y="92" textLength="135" fill="#dcdfe4">[ ] Remember me</text>
<text x="48" y="110" textLength="81" fill="#96a0b4">unchecked</text>
<text x="183" y="110" textLength="234" fill="#dcdfe4">[ ] Send me the newsletter</text>
<text x="48" y="128" textLength="63" fill="#96a0b4">checked</text>
<text x="183" y="128" textLength="27" fill="#61afef">[x]</text>
<text x="219" y="128" textLength="162" fill="#dcdfe4">I accept the terms</text>
<text x="48" y="146" textLength="117" fill="#96a0b4">indeterminate</text>
<text x="183" y="146" textLength="27" fill="#61afef">[-]</text>
<text x="219" y="146" textLength="270" fill="#dcdfe4">Select all (some are selected)</text>
<text x="48" y="164" textLength="72" fill="#96a0b4">disabled</text>
<text x="183" y="164" textLength="198" fill="#6c7078">[ ] Not available here</text>
</g>
<g shape-rendering="crispEdges">
</g>
</svg>
