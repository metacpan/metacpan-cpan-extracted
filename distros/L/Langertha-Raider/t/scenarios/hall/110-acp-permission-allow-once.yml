title: an ask under an ACP session goes to the client as session/request_permission; allow_once runs that call only, the next one is asked again and rejected
hall:
  raiders:
    Frager: { engine: mock, packs: [], mcp: [], isolated: 0, permission_mode: default }
model:
  rules:
    Schreibe zwei.:
      tool_calls:
        - [ write_file, { path: a.txt, content: "a\n" } ]
        - [ write_file, { path: b.txt, content: "b\n" } ]
  after:
    write_file: { answer: "fertig" }
  fallback: { answer: "unbekannt" }
steps:
  - acp_permissions: { answers: [ once, reject ] }
  - acp_session: { as: s, raider: Frager }
  - acp_prompt: { session: s, text: "Schreibe zwei.", as: p }
  - expect_acp: { prompt: p, stop_reason: end_turn }
  - expect_file: { path: a.txt, content: "a\n" }
  - expect_file: { path: b.txt, absent: true }
  - expect_permission_requests:
      count: 2
      first:
        title_like: 'write_file: a\.txt'
        kind: edit
        options: allow_once,allow_always,reject_once
        names_like: 'Allow for this session: Edit\(/\*\*\)'
  - idle: {}
