name    = Dancer2-Plugin-Feed
author  = Natal Ngétal
author  = Stefan Härter
license = Perl_5
copyright_holder = Natal Ngétal
copyright_header = 2012

; -- static meta-information
[MetaResources]
bugtracker.web = https://codeberg.org/demiguise/Dancer2-Plugin-Feed/issues
repository.url = ssh://git@codeberg.org/demiguise/Dancer2-Plugin-Feed.git
repository.web = https://codeberg.org/demiguise/Dancer2-Plugin-Feed
repository.type = git

[AutoVersion]

; -- Remove files
[GatherDir]
[PruneCruft]
[ManifestSkip]

; -- Get prereqs
[AutoPrereqs]

[Prereqs]
Dancer2 = 0.161000

;-- Perform tests
[CheckChangeLog]
[Test::Perl::Critic]
[TestRelease]

; -- Munge files
[PerlTidy]
[NextRelease]
[PkgVersion]
[PodWeaver]
[Prepender]
copyright = 1

; -- Generate meta files
[License]
[MakeMaker]
[ModuleBuild]
[MetaYAML]
[MetaJSON]
[Readme]
[InstallGuide]
[Manifest]

; -- Release
[ConfirmRelease]
[UploadToCPAN]
[Git::Tag]

