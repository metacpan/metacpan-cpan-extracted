name    = Music-Scales
author  = Ben Daglish <bdaglish@surfnet-ds.co.uk>
license = Perl_5
copyright_holder = Ben Daglish
copyright_year   = 2003-2026

[VersionFromModule]
[MinimumPerl]
[AutoPrereqs]

[CheckChangesHasContent]
[NextRelease]
format = %v %{yyyy-MM-dd HH:mm:ss}d

[Authority]
authority = cpan:GENE
[PkgVersion]
[PodWeaver]

[PodCoverageTests]
[PodSyntaxTests]
[Test::Compile]
[Test::Synopsis]

[MetaConfig]
[MetaJSON]
[GithubMeta]

[Test::PodSpelling]
wordlist = Pod::Wordlist
spell_cmd = aspell list
stopwords = Cruftiness
stopwords = Enharmonic
stopwords = Gb
stopwords = PDL
stopwords = Scaletypes
stopwords = TODO
stopwords = dor
stopwords = enharmonic
stopwords = notenames
stopwords = overidden
stopwords = scalenames
stopwords = th
stopwords = Boggs
stopwords = Microtones

[Prereqs / TestRequires]
Test::More = 0.88

[Prereqs / RuntimeRequires]

[GatherDir]
[PruneCruft]
[ManifestSkip]
[MetaYAML]
[Readme]
[ExtraTests]
[ExecDir]
[ShareDir]
[MakeMaker]
[Manifest]
[TestRelease]
[ConfirmRelease]
[UploadToCPAN]
[CopyFilesFromBuild]
