abstract = Moderately opinionated support module for authentication in Mojolicious applications (local and SAML2)
license  = Apache_2_0
author = Flavio Poletti (flavio@polettix.it)
copyright_holder = Flavio Poletti (flavio@polettix.it)
[@Milla]
-remove = GithubMeta

[MetaProvides::Package]
[MetaResources]
homepage        = https://codeberg.org/polettix/MojoX-Authentication
bugtracker.web  = https://codeberg.org/polettix/MojoX-Authentication/issues
repository.url  = https://codeberg.org/polettix/MojoX-Authentication.git
repository.web  = https://codeberg.org/polettix/MojoX-Authentication
repository.type = git

[Run::AfterBuild]
run = support/podversion.pl "%d" "%v" "%n"
; authordep Template::Perlish

[PruneFiles]
filename = cpanfile.snapshot
match    = ^support/
