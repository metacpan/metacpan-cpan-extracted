<g class="terminal">
<text x="48" y="92" textLength="36" class="b" fill="#dcdfe4">Keys</text>
<text x="48" y="128" textLength="531" fill="#dcdfe4">Tab selects the first link of a page, Left and Right select</text>
<text x="48" y="146" textLength="522" fill="#dcdfe4">the others, Enter follows the selected one. Backspace goes</text>
<text x="48" y="164" textLength="297" fill="#dcdfe4">back to the page before, or click</text>
<text x="354" y="164" textLength="126" fill="#101216">the start page</text>
<text x="480" y="164" textLength="9" fill="#dcdfe4">.</text>
<text x="48" y="200" textLength="36" fill="#98c379">Back</text>
<text x="111" y="200" textLength="36" fill="#ebeef3">Quit</text>
<text x="48" y="236" textLength="243" fill="#96a0b4">You are on the page 'keys'.</text>
</g>
<g shape-rendering="crispEdges">
