name    = Plack-App-Prerender
author  = Robert Rothenberg <perl@rhizomnic.com>
license = Artistic_2_0
copyright_holder = Robert Rothenberg
copyright_year   = 2020, 2026

[Keywords]
keyword = PSGI
keyword = Plack
keyword = prerendering
keyword = Chrome
keyword = proxy

[GatherDir]
exclude_match = cpanfile*
exclude_filename = LICENSE
exclude_filename = SECURITY.md
exclude_filename = doap.xml

[PruneCruft]
[CPANFile]
[License]
[DOAP]
[ExecDir]
[ShareDir]
[MakeMaker]
[Manifest]
[TestRelease]
[CheckExtraTests]
[ConfirmRelease]
[SigStore::SignRelease]

[RecommendedPrereqs]
[AutoPrereqs]

[Prereqs / BuildRecomments ]
-phase = build
-relationship = recommends
ExtUtils::MakeMaker = 7.22
Module::Metadata = 1.000015

[Prereqs / TestRecommends ]
-phase = test
-relationship = recommends
Encode = 3.00
HTTP::Tiny = 0.096

; [EnsurePrereqsInstalled]
; :version = 0.003
; type = requires
; type = recommends

[StaticInstall]
mode = auto
dry_run = 0

[GitHub::Meta]
repo = git://github.com/robrwo/perl-Plack-App-Prerender.git

[AutomationPolicy]
template = human_supervised

[SecurityPolicy]
; authordep Software::Security::Policy::Individual
-policy = Individual
timeframe = 2 weeks
perl_support_years = 10
git_url = https://github.com/robrwo/perl-Plack-App-Prerender
report_url = https://github.com/robrwo/perl-Plack-App-Prerender/security/advisories

[PodWeaver]
; authordep Pod::Weaver::Plugin::AppendPrepend
; authordep Pod::Weaver::Section::Contributors
; authordep Pod::Weaver::Section::SourceGitHub

[UsefulReadme]
; authordep Pod::Markdown::Github
type     = gfm
filename = README.md
location = build

[CopyFilesFromBuild]
copy = LICENSE
copy = README.md
copy = SECURITY.md
copy = cpanfile
copy = doap.xml

[PruneFiles]
match = ~$

[Metadata]
x_authority = cpan:RRWO

[MetaProvides::Package]
[MetaJSON]
[MetaYAML]

[InstallGuide]

[Prereqs / TestRequires ]
Plack::Middleware::ContentLength = 0
Plack::Middleware::Head = 0
; To work around bad smokers that don't install prereqs for Test::Most
Test::Differences = 0

; authordep Pod::Weaver::Plugin::AppendPrepend
; authordep Pod::Weaver::Section::Contributors
; authordep Pod::Weaver::Section::SourceGitHub

[PodSyntaxTests]
[Test::DistManifest]
; authordep Test::DistManifest
;; [Test::CleanNamespaces]
;; ; authordep Test::CleanNamespaces
[Test::EOF]
; authordep Test::EOF
[Test::EOL]
:version = 0.14
[Test::Fixme]
[Test::MinimumVersion]
[Test::NoTabs]
[Test::Perl::Critic]
critic_config = xt/etc/perlcritic.rc

[Test::Pod::Coverage::Configurable]
[Test::Pod::LinkCheck]
[Test::Portability]
; authordep Test::TrailingSpace
[Test::TrailingSpace]
filename_regex = \.(?:p[lm]|pod)\z
[Test::Kwalitee]
skiptest = use_strict

[Test::CPAN::Changes]
; authordep Test::CPAN::Changes
[Test::UnusedVars]
[Test::MixedScripts]
[MojibakeTests]
[Test::PodSpelling]

[Test::Version]
[Test::Compile]
; authordep Test::Compile
filename = xt/00-compile.t

[Test::CVE]

[Test::ReportPrereqs]
:version = 0.022
version_extractor = Module::Metadata
verify_prereqs = 1
include = Plack

[@Git]
allow_dirty = dist.ini
push_to     = origin main:main
tag_format  = %v
commit_msg  = %v%n%n%c

[Git::Contributors]
:version = 0.019

[RewriteVersion]
[NextRelease]
[BumpVersionAfterRelease]

[Git::Commit / Commit_Changes] ; commit Changes (for new dev)
allow_dirty_match = ^lib/
commit_msg = Commit Changes and bump $VERSION
