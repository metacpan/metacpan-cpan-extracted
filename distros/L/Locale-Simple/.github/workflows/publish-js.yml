name: Publish JS to npm

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Compute npm version from tag
        id: ver
        run: echo "npm_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Bump package.json
        working-directory: js
        run: npm version "${{ steps.ver.outputs.npm_version }}" --no-git-tag-version --allow-same-version

      - name: Copy Changes into js/CHANGELOG.md
        run: cp Changes js/CHANGELOG.md

      - name: Install + build + test
        working-directory: js
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

      - name: Publish
        working-directory: js
        run: npm publish --provenance --access public
