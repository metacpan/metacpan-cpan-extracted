abstract = Light wrapper around Mojo::Pg/SQLite/...
license  = Apache_2_0
author = Flavio Poletti (flavio@polettix.it)
copyright_holder = Flavio Poletti (flavio@polettix.it)
[@Milla]
-remove = GithubMeta

[MetaProvides::Package]
[MetaResources]
homepage        = https://codeberg.org/polettix/MojoX-MojoDbWrap
bugtracker.web  = https://codeberg.org/polettix/MojoX-MojoDbWrap/issues
repository.url  = https://codeberg.org/polettix/MojoX-MojoDbWrap.git
repository.web  = https://codeberg.org/polettix/MojoX-MojoDbWrap
repository.type = git

[Run::AfterBuild]
run = support/podversion.pl "%d" "%v" "%n"
; authordep Template::Perlish

[PruneFiles]
filename = cpanfile.snapshot
match    = ^support/
