author  = Torsten Raudssus <getty@cpan.org>
license = Perl_5
copyright_holder = Torsten Raudssus <torsten@raudssus.de> L<https://raudssus.de/>
copyright_year   = 2026

[@Author::GETTY]
; @Basic ships plain [MakeMaker], whose generated Makefile.PL sets
; TESTS => 't/*.t' -- non-recursive, so 'make test' (and every CPAN tester)
; would silently skip t/upstream/*.t. Drop it and drive MakeMaker::Awesome
; with a recursive test glob instead.
no_makemaker = 1

[MakeMaker::Awesome]
test_file = t/*.t
test_file = t/*/*.t
