# PostgreSQL for the DBIO demo (see demo/README).
#
# RESOURCE DISCIPLINE — this may well run on a small SHARED box (few cores,
# alongside other DBs and services). The pod carries resources.limits so it can
# never starve the host. Bring up ONE demo DB at a time and DELETE it when done
# (`kubectl delete -f demo/k8s/`) — a forgotten pod is capped but still noise.
# See the RESOURCE LIMITS section of DBIO::Test::Kubernetes, and the "Live
# testing" section in .claude/rules/dbio-rules.md.
---
apiVersion: v1
kind: Service
metadata:
  name: dbio-demo-pg
  labels:
    app: dbio-demo-pg
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: dbio-demo-pg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbio-demo-pg
  labels:
    app: dbio-demo-pg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dbio-demo-pg
  template:
    metadata:
      labels:
        app: dbio-demo-pg
    spec:
      containers:
        - name: postgres
          image: postgres:17
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"          # at most one core on a shared box
              memory: 1Gi
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: dbio_demo
            - name: POSTGRES_USER
              value: dbio
            - name: POSTGRES_PASSWORD
              value: dbio
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dbio", "-d", "dbio_demo"]
            initialDelaySeconds: 5
            periodSeconds: 5
