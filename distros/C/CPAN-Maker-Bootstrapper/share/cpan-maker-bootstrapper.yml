---
commands:
  annotate:                 CPAN::Maker::Bootstrapper::Role::LLM::Annotator
  code-finding:             CPAN::Maker::Bootstrapper::Role::LLM::Reviewer
  code-review:              CPAN::Maker::Bootstrapper::Role::LLM::Reviewer
  create-config:            CPAN::Maker::Bootstrapper::Role::CreateConfig
  create-deps:              CPAN::Maker::Bootstrapper::Role::CreateDeps
  create-darkpan-requires:  CPAN::Maker::Bootstrapper::Role::DarkPANRequires
  critique:                 CPAN::Maker::Bootstrapper::Role::Critic
  default:                  cmd_install
  deps-filter:              CPAN::Maker::Bootstrapper::Role::DepsFilter
  dist-file:                CPAN::Maker::Bootstrapper::Role::DistFile
  filter:                   CPAN::Maker::Bootstrapper::Role::Filter 
  install:                  CPAN::Maker::Bootstrapper::Role::Installer
  import-scaffold:          CPAN::Maker::Bootstrapper::Role::ScaffoldImporter
  models:                   CPAN::Maker::Bootstrapper::Role::LLM::Models
  pod-finding:              CPAN::Maker::Bootstrapper::Role::LLM::Reviewer
  pod-review:               CPAN::Maker::Bootstrapper::Role::LLM::Reviewer
  provides:                 CPAN::Maker::Bootstrapper::Role::Provides
  publish-to-cpan:          CPAN::Maker::Bootstrapper::Role::PAUSEUpload
  release-notes:            CPAN::Maker::Bootstrapper::Role::LLM::ReleaseNotes
  show-defaults:            CPAN::Maker::Bootstrapper::Role::ShowDefaults
  update-annotations:       CPAN::Maker::Bootstrapper::Role::LLM::Annotator
  extra-files:              CPAN::Maker::Bootstrapper::Role::ExtraFiles
  resolve-vars:             CPAN::Maker::Bootstrapper::Role::ResolveVars
  version:                  CPAN::Maker::Bootstrapper::Role::Version
options:
- auto-annotate|A
- annotate|a=s@
- color!
- comment|co=s
- context|C=s@
- debug|d
- dry-run|D
- exclude=s@
- file-list|L=s
- filter=s
- finalize-annotations|F
- history!
- max-diff-files=i
- max-tokens|t=i
- model|M=s
- project-tarball
- prompt|p=s
- prompt-profile|P=s@
- help|h
- basedir|b=s
- config|c=s
- email|e=s
- force|f!
- github-user|g=s
- installdir|i=s
- import|I=s@
- module|m=s
- resources|r=s
- strict!
- stub|s=s
- username|u=s
- vars-file=s
abbreviations: 1
alias:
  options:
    dryrun: dry-run
extra_options:
  - llm
  - llm_api_key_helper
  - dist_dir
  - import_file_listing
  - help_sections
default_options:
  color: 1
  strict: 1
  help_sections:
      - SYNOPSIS
      - COMMANDS
      - OPTIONS
