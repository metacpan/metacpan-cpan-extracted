name             = Review-Helper
author           = Chad Granum <exodist7@gmail.com>
license          = Perl_5
copyright_holder = Chad Granum

[RewriteVersion]   ; sets dist version from the main module's $VERSION
[License]
[ManifestSkip]
[Manifest]
[NextRelease]

[GatherDir]
; share/ holds symlinks to the top-level ux, skills and standards directories;
; following them ships the real files.
follow_symlinks  = 1
exclude_match    = ^agent_scripts/
exclude_match    = ^cover              ; cover_db and friends
exclude_match    = ^nyt
exclude_match    = ^test-logs
exclude_match    = ^pt                 ; only run these tests locally
exclude_match    = ^tt                 ; only run these tests locally
exclude_match    = ^xt/downstream      ; only run these tests locally
exclude_match    = ^t/                 ; re-gathered below, to pick up dotfiles
exclude_match    = ^[^/]+\.md$          ; internal docs never ship; share/ skills do
exclude_match    = ^share/[^/]+/AGENTS\.md$ ; agent instructions for each shared part
exclude_filename = LICENSE
exclude_filename = Makefile.PL
exclude_filename = README
exclude_filename = README.md
exclude_filename = cpanfile
exclude_filename = cpanfile.ci
exclude_filename = TEMPLATE.pod
exclude_filename = .yath-persist.json

[PruneCruft]

; Re-gather t/ through Git so t/ dotfiles ship. One block per test root.
[Git::GatherDir / GatherDotFilesT]
root             = t/
prefix           = t/
include_dotfiles = 1

; The AI/LLM policy is the one internal .md that ships. Gathered back by name
; because the top-level .md exclusion above is otherwise correct.
[GatherFile]
filename = AI_AND_LLM_POLICY.md

[ExecDir]
dir = scripts

[ShareDir]
dir = share

; OPTIONAL -- only if POD is generated at build time
;[Run::AfterBuild]
;run = release-scripts/generate_command_pod.pl %d

[PodSyntaxTests]
[TestRelease]
[Test::ChangesHasContent]

; OPTIONAL -- required when the distribution has an xt/ directory
;[RunExtraTests]

[MetaResources]
bugtracker.web  = https://github.com/exodist/Review-Helper/issues
repository.url  = https://github.com/exodist/Review-Helper/
repository.type = git

[Prereqs]
perl             = 5.036000
Capture::Tiny    = 0
Cpanel::JSON::XS = 0
DBD::SQLite      = 1.68
DBI              = 0
File::ShareDir   = 0
Getopt::Yath     = 2.000009
Object::HashBase = 0
Plack            = 0
Role::Tiny       = 0
Router::Simple   = 0
UUID             = 0.39

[Prereqs / TestRequires]
Test2::V0 = 0.000060

[Prereqs / ConfigureRequires]
ExtUtils::MakeMaker = 0

[MakeMaker]

; OPTIONAL -- replace [MakeMaker] with [MakeMaker::Awesome] only when this
; project needs a configure-time guard or header. See DZIL_GUIDE.md.

[CPANFile]
[MetaYAML]
[MetaJSON]

; authordep Pod::Markdown
[ReadmeFromPod / Markdown]
filename = lib/Review/Helper.pm
type     = markdown
readme   = README.md

[ReadmeFromPod / Text]
filename = lib/Review/Helper.pm
type     = text
readme   = README

[CopyFilesFromBuild]
copy = LICENSE
copy = cpanfile
copy = README
copy = README.md
copy = Makefile.PL

; The distribution ships ux/, skills/ and standards/ from the top of the
; repository, so the git checks and commits work from the repository root.
[Git::Check]
repo_root   = ..
allow_dirty = Changes

[Git::Commit]
repo_root   = ..
allow_dirty = Changes

[Git::Tag]
repo_root = ..

; Releases are manual: build, test, tag, bump -- but never upload.
[FakeRelease]

[BumpVersionAfterRelease]

[Git::Commit / Commit_Changes]
repo_root         = ..
munge_makefile_pl = true
allow_dirty_match = ^perl/lib
allow_dirty_match = ^perl/scripts
commit_msg        = Automated Version Bump
