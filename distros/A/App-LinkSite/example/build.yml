name: Build and deploy site

on:
  push:
    branches:
      - 'main'
    paths:
      - 'links.json'
      - 'img/**'
      - 'CNAME'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    # Manual runs can select other branches; only main may build and deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: davorg/links:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create page
        env:
          LINKSITE_DEBUG: 1
        run: |
          linksite

      - name: Build pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

