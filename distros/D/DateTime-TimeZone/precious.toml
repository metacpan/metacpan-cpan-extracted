exclude = [
    ".build/**/*",
    "DateTime-TimeZone-*/**/*",
    "META.yml",
    "MYMETA.yml",
    "blib/**/*",
    "lib/DateTime/TimeZone/Catalog.pm",
    "lib/DateTime/TimeZone/{Africa,America,Antarctica,Asia,Atlantic,Australia,Europe,Indian,Pacific}/**/*",
    "lib/DateTime/TimeZone/{CET,CST6CDT,EET,EST5EDT,EST,HST,MET,MST7MDT,MST,PST8PDT,WET}.pm",
    "t/00-*",
    "t/author-*",
    "t/release-*",
    "t/zd_*",
    "t/zzz-*",
    "xt/**/*",
]

[commands.omegasort-gitignore]
type = "both"
include = "**/.gitignore"
cmd = ["omegasort", "--sort", "path", "--unique"]
lint_flags = "--check"
tidy_flags = "--in-place"
ok_exit_codes = 0
lint_failure_exit_codes = 1
ignore-stderr = ["The .+ file is not sorted", "The .+ file is not unique"]

[commands.omegasort-stopwords]
type = "both"
include = ".stopwords"
cmd = ["omegasort", "--sort", "text", "--case-insensitive", "--unique"]
lint_flags = "--check"
tidy_flags = "--in-place"
ok_exit_codes = 0
lint_failure_exit_codes = 1
ignore-stderr = ["The .+ file is not sorted", "The .+ file is not unique"]

[commands.perlcritic]
type = "lint"
include = ["**/*.{pl,pm,t,psgi}"]
cmd = ["perlcritic", "--profile=$PRECIOUS_ROOT/perlcriticrc"]
ok_exit_codes = 0
lint_failure_exit_codes = 2

[commands.perltidy]
type = "both"
include = ["**/*.{pl,pm,t,psgi}"]
cmd = ["perltidy", "--profile=$PRECIOUS_ROOT/perltidyrc"]
lint_flags = ["--assert-tidy", "--no-standard-output", "--outfile=/dev/null"]
tidy_flags = ["--backup-and-modify-in-place", "--backup-file-extension=/"]
ok_exit_codes = 0
lint_failure_exit_codes = 2
ignore_stderr = "Begin Error Output Stream"

[commands.podchecker]
type = "lint"
include = ["**/*.{pl,pm,pod}"]
cmd = ["podchecker", "--warnings", "--warnings"]
ok_exit_codes = [0, 2]
lint_failure_exit_codes = 1
ignore_stderr = [
    ".+ pod syntax OK",
    ".+ does not contain any pod commands",
    '\*\*\* WARNING: multiple occurrences \(\d+\) of link target .+',
    '\*\*\* WARNING: empty section in previous paragraph .+',
]

[commands.podtidy]
type = "tidy"
include = ["**/*.{pl,pm,pod}"]
cmd = ["podtidy", "--columns", "80", "--inplace", "--nobackup"]
ok_exit_codes = 0
lint_failure_exit_codes = 1

[commands.oxfmt]
type = "both"
include = ["**/*.yml", "**/*.toml"]
cmd = ["oxfmt"]
lint-flags = "--check"
tidy-flags = "--write"
ok-exit-codes = 0
lint-failure-exit-codes = 1

[commands.typos]
type = "both"
include = "**/*"
exclude = [".stopwords"]
cmd = "typos"
tidy_flags = "--write-changes"
invoke = "once"
ok-exit-codes = 0
lint-failure-exit-codes = 2
