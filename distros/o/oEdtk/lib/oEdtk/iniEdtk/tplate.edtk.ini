# ---------------------------------------------------------------------------
# Fork services (oEdtk 0.8032). All are inactive by default, so the mainline
# behaviour is preserved; fill a value in to switch the feature on.
[SERVICES]
# Public e-mailing service base URL (fork oEdtk::Emailing, service
# nws_emailing); the module appends "/emails". Empty: the service is unused.
NWS_EMAILING_URI	=
# E-mailing service template name and User-Agent string. Empty: each client
# falls back to its shipped default (see oEUser::Emailing).
EMAILING_TEMPLATE	=
EMAILING_USER_AGENT	=
# Keycloak token endpoint and client credentials (fork oEdtk::Keycloak). All
# three are required together when Keycloak is used.
KEYCLOAK_URL		=
KEYCLOAK_CLIENT_ID	=
KEYCLOAK_SECRET_ID	=
# Keycloak token realm (the /realms/<realm>/... path element). Empty:
# the client's shipped default realm is used.
KEYCLOAK_REALM		=
# Dissemination-plan service URL (fork oEdtk::DisseminationPlan and Main).
# Empty: the dissemination step is skipped (mainline behaviour).
DISSEMINATION_PLAN_URL	=
# TLS settings shared by the service clients (oEUser::Net). EDTK_SSL_VERIFY = 1
# (the safe default) keeps peer and host-name verification ON; set it to 0 only
# for a service fronted by a private CA. EDTK_SSL_CA_PATH names the CA bundle,
# a file or a directory; empty uses the system trust store.
EDTK_SSL_VERIFY		= 1
EDTK_SSL_CA_PATH	=
# Named acquittal callable "Module::function", invoked by DBAdmin after an ECM
# exchange (D24). Validated against a regex and loaded explicitly; empty: no
# API acquittal (mainline behaviour). User-specific variants live in oEUser.
EDTK_ACQUIT_API		=
# Acknowledgement report address list (fork DBAdmin). When an acquittal
# import skips lines, DBAdmin mails the recap there through the
# oEdtk::Emailing delegate. Empty: no report.
EDTK_MAIL_ACQ	=
# ECM API base URL and the static editique API key the ECM injector presents
# in its Authorization header (fork oEUser::ECM, ported to oEdtk::ECM; D22).
# Empty: the ECM injector is unusable.
APIECM_URL		=
APIECM_APIKEY_EDITIQUE	=


