name    = byterazor-HiD-LLMS
author  = Dominik Meyer <dmeyer@federationhq.de>
copyright_holder = Dominik Meyer
copyright_year   = 2026

main_module = lib/byterazor/HiD/LLMS.pm

[@Git]
[Git::NextVersion]
first_version = 0.1.0       ; this is the default
version_by_branch = 1       ; this is the default

[GatherDir]
[PruneCruft]
[ManifestSkip]
[MetaYAML]
[ExtraTests]
[ExecDir]
[ShareDir]
[MakeMaker]
[Manifest]
[AutoPrereqs]

[MetaResources]
repository.url    = https://gitea.federationhq.de/byterazor/HiD-LLMS.git
repository.type   = git

[PodWeaver]
[TestRelease]
[ConfirmRelease]
[UploadToCPAN]
