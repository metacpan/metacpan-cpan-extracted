name = Webservice-Overleaf-API
license = Perl_5
author = Brett Estrade <oodler@cpan.org>
copyright_holder = Brett Estrade
copyright_year = 2026

[@Basic]
[VersionFromModule]
[MetaJSON]
[MetaResources]
homepage = https://github.com/oodler577/p5-Webservice-Overleaf-API
repository.web = https://github.com/oodler577/p5-Webservice-Overleaf-API
repository.url = https://github.com/oodler577/p5-Webservice-Overleaf-API.git
repository.type = git
bugtracker.web = https://github.com/oodler577/p5-Webservice-Overleaf-API/issues
[CheckChangeLog]

[Prereqs]
perl = >= 5.010
Dispatch::Fu = >= 1.07
Util::H2O::More = >= 0.4.6
JSON::PP = 0
URI::Escape = 0
MIME::Base64 = 0
HTML::Entities = 0
Pod::Text = 0
Cwd = 0
File::Basename = 0
File::Spec = 0
File::Temp = 0
HTTP::Tiny = 0
; Required for HTTPS support used by HTTP::Tiny.
IO::Socket::SSL = >= 1.56
Net::SSLeay = >= 1.49
Mozilla::CA = 0

[Prereqs / TestPrereqs]
-phase = test
Test::More = 0

[PruneCruft]

[PruneFiles]
; never ship Overleaf authentication material
filename = session.out
match = ^\.overleaf/

; LaTeX / Overleaf compiler output
match = \.(?:aux|bbl|bcf|blg|chktex|fdb_latexmk|fls|log|lof|lot|nav|out|pdf|pdfxref|snm|stderr|stdout|synctex(?:\.gz)?|toc|vrb|xdv)$
match = \.run\.xml$

; minted / Pygments generated files
match = ^_minted-.*/
match = \.(?:pygtex|pygstyle)$

; downloaded project archives
match = \.zip$
