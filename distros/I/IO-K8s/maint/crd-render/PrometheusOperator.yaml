# PrometheusOperator CRD emitter overlay (D5/D6, k95 conventions, k120).
#
# Read by maint/crd-drift-check.pl --render/--check for --provider
# PrometheusOperator, at the pinned upstream_version (v0.93.1,
# github.com/prometheus-operator/prometheus-operator). `names` maps the
# logical path below each Kind (what IO::K8s::AutoGen::class_path returns,
# e.g. Spec::ClusterTLS) to the bare upstream Go type name -- which is the
# checked-in class name under IO::K8s::PrometheusOperator::V1 (D6). Several
# paths across Kinds map to the SAME name (SafeTLSConfig, SecretOrConfigMap,
# OAuth2, ...): those are one shared Go type embedded at many points, and the
# emitter collapses them to one file the way Cilium's shared Rule family does.
#
# Two k120 overlay mechanisms appear here, neither of which the pre-k120
# names/with/extra vocabulary could express:
#
#   * no_reuse_core -- logical paths where D5 core-reuse is suppressed so the
#     provider's OWN named type is generated even though its shape matches a
#     shipped core class. Alertmanager's additionalArgs items are {name,value}
#     and would reuse Core::V1::HTTPHeader; upstream calls that type Argument
#     and lib ships it, so Spec::AdditionalArgsItem is listed here and named
#     Argument below. The Smtp smartHost {host,port} pair is the same story
#     against a core HostPort shape.
#
#   * an absolute `names` value (one carrying '::') -- a reference to a class
#     this render does not itself emit. Spec::ImagePullSecretsItem is a
#     single-key {name} that the reuse heuristic will not fold on its own
#     (it needs two keys), but lib types it as Core::V1::LocalObjectReference;
#     naming the path at the absolute core package makes the emitter reference
#     that class and skip writing a per-provider copy.
#
# Provenance: this map was derived by walking each rendered Kind tree in
# lockstep with the checked-in lib tree and reading lib's own class
# references as the naming oracle (the fields agree field-for-field -- the
# k120 schema audit found 0 constraint differences), then verified with
# --check. It closes the STRUCTURAL half: 0 missing-in-lib, 0 not-rendered.
# The residual --check DIFFERS are body formatting only (POD line wrapping, a
# contextual # ABSTRACT taken from the embedding field's description on a
# shared type, and lib's hand-written explanatory comments), the same
# lib-rewrite follow-up VolumeSnapshot's own overlay left behind -- not a
# name, field or type this overlay could touch without editing lib.
base: IO::K8s::PrometheusOperator
kinds:
  Alertmanager:
    extra: []
    with:
    - IO::K8s::Role::Namespaced
    no_reuse_core:
    - Spec::AdditionalArgsItem
