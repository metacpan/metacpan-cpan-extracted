<g class="terminal">
<text x="66" y="92" textLength="72" fill="#61afef">snapback</text>
<text x="372" y="92" textLength="144" fill="#dcdfe4">fourteen remain,</text>
<text x="525" y="92" textLength="45" class="i" fill="#dcdfe4">after</text>
<text x="579" y="92" textLength="279" fill="#dcdfe4">the new backup has finished. It</text>
<text x="84" y="110" textLength="108" fill="#61afef">Installation</text>
<text x="372" y="110" textLength="468" fill="#dcdfe4">never deletes the backup it has just made, even with</text>
<text x="849" y="110" textLength="36" fill="#e5c07b">keep</text>
<text x="84" y="128" textLength="153" fill="#61afef">Your first backup</text>
<text x="372" y="128" textLength="27" fill="#e5c07b">= 0</text>
<text x="399" y="128" textLength="9" fill="#dcdfe4">.</text>
<text x="84" y="146" textLength="72" fill="#61afef">Settings</text>
<text x="102" y="164" textLength="135" fill="#61afef">Excluding files</text>
<text x="354" y="164" textLength="45" class="b" fill="#ebeef3">Hooks</text>
<text x="48" y="182" textLength="9" class="b" fill="#dcdfe4">&gt;</text>
<text x="102" y="182" textLength="171" fill="#61afef">Keeping old backups</text>
<text x="84" y="200" textLength="45" fill="#61afef">Hooks</text>
<text x="372" y="200" textLength="486" fill="#dcdfe4">A hook is a Perl script that snapback runs after every</text>
<text x="84" y="218" textLength="135" fill="#61afef">Restoring files</text>
<text x="372" y="218" textLength="459" fill="#dcdfe4">backup, with the directory of the new backup as its</text>
<text x="84" y="236" textLength="135" fill="#61afef">Troubleshooting</text>
<text x="372" y="236" textLength="486" fill="#dcdfe4">argument. Use it to send a message, to copy the backup</text>
<text x="102" y="254" textLength="144" fill="#61afef">The disk is full</text>
<text x="372" y="254" textLength="216" fill="#dcdfe4">further, or to check it.</text>
<text x="102" y="272" textLength="198" fill="#61afef">A file is copied every</text>
<text x="48" y="290" textLength="36" fill="#61afef">time</text>
<text x="381" y="290" textLength="171" fill="#dcdfe4">#!/usr/bin/env perl</text>
<text x="84" y="308" textLength="72" fill="#61afef">See also</text>
<text x="381" y="308" textLength="396" fill="#dcdfe4"># ~/.snapback-hook: report every new backup.</text>
<text x="381" y="326" textLength="90" fill="#dcdfe4">use v5.32;</text>
<text x="381" y="344" textLength="117" fill="#dcdfe4">use warnings;</text>
<text x="381" y="380" textLength="135" fill="#dcdfe4">use File::Find;</text>
<text x="381" y="416" textLength="513" fill="#dcdfe4">my ($backup) = @ARGV or die &quot;usage: $0 BACKUP-DIRECTORY\n</text>
<text x="898.5" y="416" text-anchor="middle" fill="#8c929e">›</text>
<text x="381" y="434" textLength="126" fill="#dcdfe4">my $files = 0;</text>
<text x="381" y="452" textLength="513" fill="#dcdfe4">find( sub { $files++ if -f $_ }, $backup );    # every fi</text>
<text x="898.5" y="452" text-anchor="middle" fill="#8c929e">›</text>
<text x="381" y="470" textLength="477" fill="#dcdfe4">say &quot;snapback: new backup $backup with $files files&quot;;</text>
<text x="372" y="506" textLength="486" fill="#dcdfe4">Make the script executable and name it in the settings</text>
</g>
