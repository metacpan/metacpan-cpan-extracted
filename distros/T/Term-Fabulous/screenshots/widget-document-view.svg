<g class="terminal">
<text x="75" y="110" textLength="72" fill="#dcdfe4">The code</text>
<text x="156" y="110" textLength="45" fill="#101216">block</text>
<text x="201" y="110" textLength="495" fill="#dcdfe4">s scroll sideways together with Left and Right, or with</text>
<text x="75" y="128" textLength="171" fill="#dcdfe4">a horizontal wheel:</text>
<text x="84" y="164" textLength="477" fill="#dcdfe4">my $view = Term::Fabulous::Widget::DocumentView-&gt;new(</text>
<text x="120" y="182" textLength="207" fill="#dcdfe4">id       =&gt; &quot;document&quot;,</text>
<text x="120" y="200" textLength="504" fill="#dcdfe4">document =&gt; $document,    # from a parser of your format</text>
<text x="84" y="218" textLength="18" fill="#dcdfe4">);</text>
<text x="57" y="254" textLength="45" class="b" fill="#ebeef3">Links</text>
<text x="75" y="290" textLength="126" fill="#dcdfe4">A link such as</text>
<text x="210" y="290" textLength="234" fill="#101216">Term::Fabulous on MetaCPAN</text>
<text x="453" y="290" textLength="252" fill="#dcdfe4">is selected with l and L and</text>
<text x="75" y="308" textLength="414" fill="#dcdfe4">followed with Enter or a click; the text fires</text>
<text x="498" y="308" textLength="108" fill="#e5c07b">LinkActivate</text>
<text x="615" y="308" textLength="63" fill="#dcdfe4">and the</text>
<text x="75" y="326" textLength="234" fill="#dcdfe4">program does the rest. The</text>
<text x="318" y="326" textLength="45" fill="#61afef">Items</text>
<text x="372" y="326" textLength="252" fill="#dcdfe4">section above is a link too.</text>
<text x="57" y="362" textLength="90" class="b" fill="#ebeef3">Any widget</text>
<text x="75" y="398" textLength="594" fill="#dcdfe4">Any other widget is an item as it is, this table for one; a search</text>
<text x="75" y="416" textLength="432" fill="#dcdfe4">finds the text of its cells, and Tab reaches it.</text>
<text x="93" y="470" textLength="63" class="b" fill="#ebeef3">Factory</text>
<text x="201" y="470" textLength="45" class="b" fill="#ebeef3">Makes</text>
<text x="93" y="506" textLength="63" fill="#dcdfe4">heading</text>
<text x="201" y="506" textLength="135" fill="#dcdfe4">a heading block</text>
<text x="93" y="524" textLength="81" fill="#dcdfe4">paragraph</text>
<text x="201" y="524" textLength="153" fill="#dcdfe4">a paragraph block</text>
<text x="93" y="542" textLength="36" fill="#dcdfe4">code</text>
<text x="201" y="542" textLength="108" fill="#dcdfe4">a code block</text>
<text x="57" y="596" textLength="36" class="b" fill="#61afef">MORE</text>
<text x="75" y="650" textLength="630" fill="#dcdfe4">Paragraph 1 of a longer document, so that there is something to scroll</text>
<text x="75" y="668" textLength="639" fill="#dcdfe4">through and to search for: the word block appears in every one of them.</text>
<text x="39" y="704" textLength="612" fill="#96a0b4">Code   12%  |  Enter follows https://metacpan.org/pod/Term::Fabulous</text>
</g>
