---
clear_miss_cache:
  config:
    close_stdin: 1
    dedup: 1
    test_empty: 1
    test_non_ascii: 0
    test_nuls: 0
    test_security: 0
    test_undef: 0
  function: clear_miss_cache
  input:
    scope:
      _source: input_spec
      optional: 1
      position: 0
      type: string
  module: Geo::Coder::Free
  output:
    _success_indicator: 1
    _void_context_hint: mutator
    type: boolean
geocode:
  config:
    close_stdin: 1
    dedup: 1
    test_empty: 1
    test_non_ascii: 0
    test_nuls: 0
    test_security: 0
    test_undef: 0
  function: geocode
  input:
    ignore_words:
      _source: input_spec
      optional: 1
      type: arrayref
    location:
      _source: input_spec
      optional: 1
      type: string
    on_error:
      _source: input_spec
      optional: 1
      type: string
    region:
      _source: input_spec
      optional: 1
      type: string
    scantext:
      _source: input_spec
      optional: 1
      type: string
  module: Geo::Coder::Free
  new: ~
  output:
    _context_aware: 1
    _error_handling:
      implicit_undef:
      - '!length($params{''location''}) || ($on_error eq ''undef'')'
      - '!length($params{''scantext''}) || ($on_error eq ''undef'')'
      - $self->_scantext_missed($miss_key)
      type: string
    _error_return: undef
    _list_context:
      type: array
    _scalar_context:
      type: scalar
    type: string
