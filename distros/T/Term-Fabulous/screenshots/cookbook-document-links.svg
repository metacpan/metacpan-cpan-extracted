<g class="terminal">
<text x="39" y="74" textLength="234" class="b" fill="#61afef">Frequently asked questions</text>
<text x="39" y="128" textLength="306" class="b" fill="#ebeef3">Does snapback encrypt the backups?</text>
<text x="57" y="164" textLength="666" fill="#dcdfe4">No. Put the backup disk on an encrypted file system, or encrypt the backup</text>
<text x="57" y="182" textLength="36" fill="#dcdfe4">in a</text>
<text x="102" y="182" textLength="36" fill="#101216">hook</text>
<text x="138" y="182" textLength="9" fill="#dcdfe4">.</text>
<text x="39" y="218" textLength="306" class="b" fill="#ebeef3">Can I back up to another computer?</text>
<text x="57" y="254" textLength="648" fill="#dcdfe4">Not directly: snapback writes to a directory. Mount the other computer's</text>
<text x="57" y="272" textLength="630" fill="#dcdfe4">disk over the network and give snapback the mounted directory, or copy</text>
<text x="57" y="290" textLength="252" fill="#dcdfe4">each new backup from a hook.</text>
<text x="39" y="326" textLength="306" class="b" fill="#ebeef3">Why is the second backup so small?</text>
<text x="57" y="362" textLength="666" fill="#dcdfe4">Files that did not change are hard links to the backup before, so only the</text>
<text x="57" y="380" textLength="207" fill="#dcdfe4">changes take space. See</text>
<text x="273" y="380" textLength="153" fill="#61afef">your first backup</text>
<text x="426" y="380" textLength="9" fill="#dcdfe4">.</text>
<text x="39" y="416" textLength="333" fill="#dcdfe4">l: next link Enter: follow Backspace:</text>
<text x="385.5" y="416" text-anchor="middle" fill="#dcdfe4">…</text>
<text x="408" y="416" textLength="54" fill="#61afef">faq.md</text>
<text x="480" y="416" textLength="261" fill="#787e8a">Frequently asked questions 0%</text>
</g>
<g shape-rendering="crispEdges">
<rect x="273" y="381" width="153" height="1" fill="#61afef"/>
</g>
