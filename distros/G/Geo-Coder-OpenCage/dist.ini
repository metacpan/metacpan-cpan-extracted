name             = Geo-Coder-OpenCage
version          = 0.44
abstract         = Forward and reverse geocoding with the OpenCage Geocoding API
author           = Ed Freyfogle <cpan@opencagedata.com>
license          = Perl_5
copyright_holder = OpenCage GmbH

[Prereqs / RuntimeRequires]
Carp             = 1.50
Cpanel::JSON::XS = >= 4.82
HTTP::Tiny       = >= 0.096
IO::Socket::SSL  = 2.099
JSON::MaybeXS    = 1.004008
Scalar::Util     = >= 1.70
URI              = >= 5.40

[Prereqs / TestRequires]
LWP::Protocol::https = 6.17
LWP::UserAgent  = 6.83
Mozilla::CA     = 20261105
Net::Ping       = 2.77
Test::Exception = 0.43
Test::More      = 1.302226
Test::Perl::Critic = 1.04
Test::Warn      = 0.37

[GatherDir]

; for removing unwanted files, e.g. files starting a '.'
[PruneCruft]


; https://metacpan.org/source/KENTNL/Dist-Zilla-Plugin-MetaProvides-2.001000/README
[MetaProvides::Package]

[MakeMaker]
[MetaJSON]
[MetaYAML]
[Manifest]

[PkgVersion]
; "package NAME VERSION;" instead of a $VERSION line before "use strict;",
; which Perl::Critic rejects
use_package = 1
[PodWeaver]
[License]
[Readme]

[GithubMeta]

; see http://dzil.org/tutorial/vcs-git.html
[Git::Check]
untracked_files = die
[Git::Commit]
[Git::Tag]
[Git::Push]

[TestRelease]
[ConfirmRelease]
[UploadToCPAN]
