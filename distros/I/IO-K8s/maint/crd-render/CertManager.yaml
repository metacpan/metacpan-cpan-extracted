# cert-manager CRD emitter overlay (D5/D6, k95, task B-cert-manager).
#
# Read by maint/crd-drift-check.pl --render/--check for --provider CertManager.
# `names` maps the logical path below each Kind (what
# IO::K8s::AutoGen::class_path returns, e.g. "Spec::Solver::Dns01::Route53")
# to the upstream Go type name at the pinned upstream_version (v1.21.1):
#   pkg/apis/certmanager/v1/types_certificate.go, types_certificaterequest.go,
#   types_issuer.go (github.com/cert-manager/cert-manager -- IssuerSpec is
#   the literal same Go type embedded by both Issuer and ClusterIssuer, so
#   both Kinds below map their whole spec tree onto the same class names)
#   pkg/apis/acme/v1/types_issuer.go (ACMEIssuer/ACMEChallengeSolver family,
#   embedded by Issuer/ClusterIssuer's `acme` and referenced directly by
#   Challenge's `solver` -- one shared class set across all three Kinds),
#   types_challenge.go, types_order.go
#   pkg/apis/meta/v1/types.go (IssuerReference, SecretKeySelector,
#   LocalObjectReference -- shared across every Kind that carries them)
# A Go type reused verbatim across Kinds or fields (SecretKeySelector,
# IssuerReference, LocalObjectReference, ServiceAccountRef,
# CertificateDNSNameSelector, the whole ACMEChallengeSolver family, the
# whole IssuerSpec family) maps to the same bare name at every occurrence --
# one shared class, per D6. The HTTP01 solver's inlined pod template is
# cert-manager's own trimmed corev1.PodSpec subset, not the full
# PodTemplateSpec, so reuse_core leaves it a nested class (as documented in
# lib/IO/K8s/AutoGen.pm) -- named after cert-manager's own
# ACMEChallengeSolverHTTP01IngressPodTemplate/PodObjectMeta/PodSpec Go types
# (shared between the Ingress and GatewayHTTPRoute solvers, which embed the
# literal same Go struct). `with`/`extra` are copied verbatim from the
# opaque roots this overlay replaces.
base: IO::K8s::CertManager
kinds:
  Certificate:
    extra: []
    names:
      Spec::AdditionalOutputFormatsItem: CertificateAdditionalOutputFormat
      Spec::IssuerRef: IssuerReference
      Spec::Keystores: CertificateKeystores
      Spec::Keystores::Jks: JKSKeystore
      Spec::Keystores::Jks::PasswordSecretRef: SecretKeySelector
      Spec::Keystores::Pkcs12: PKCS12Keystore
      Spec::Keystores::Pkcs12::PasswordSecretRef: SecretKeySelector
      Spec::NameConstraints: NameConstraints
      Spec::NameConstraints::Excluded: NameConstraintItem
      Spec::NameConstraints::Permitted: NameConstraintItem
      Spec::OtherNamesItem: OtherName
      Spec::PrivateKey: CertificatePrivateKey
      Spec::Renewal: CertificateRenewal
      Spec::Renewal::WindowsItem: CertificateRenewalWindows
      Spec::SecretTemplate: CertificateSecretTemplate
      Spec::Subject: X509Subject
      Status::Acme: CertificateACMEStatus
      Status::Acme::Ari: CertificateACMEARIStatus
      Status::Acme::Ari::SuggestedWindow: ACMERenewalWindow
      Status::ConditionsItem: CertificateCondition
    with:
    - IO::K8s::Role::Namespaced
    - IO::K8s::Role::CertManaged
  CertificateRequest:
    extra: []
    no_reuse_core:
    - Status::ConditionsItem
    names:
      Spec::IssuerRef: IssuerReference
      Status::ConditionsItem: CertificateRequestCondition
    with:
    - IO::K8s::Role::Namespaced
  Challenge:
    extra: []
    names:
      Spec::IssuerRef: IssuerReference
      Spec::Solver: ACMEChallengeSolver
      Spec::Solver::Dns01: ACMEChallengeSolverDNS01
