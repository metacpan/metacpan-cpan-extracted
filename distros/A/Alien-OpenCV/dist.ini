name    = Alien-OpenCV
author  = Zakariyya Mughal <zmughal@cpan.org>
license = Perl_5
copyright_holder = Zakariyya Mughal
copyright_year   = 2022

version = 0.003

; has to come before Git::Commit
[NextRelease]
[PkgVersion]

[@Starter::Git]
revision = 5
Git::GatherDir.exclude_filename = Makefile.PL

[CopyFilesFromBuild]
copy = Makefile.PL

[AutoPrereqs]
[AlienBuild]
; authordep Alien::Build::Plugin::Download::GitHub = 0.09
[CheckChangesHasContent]
[GithubMeta]
[ReadmeAnyFromPod]
type = markdown
location = root
filename = README.md
phase = release
[Regenerate::AfterReleasers]
plugin = ReadmeAnyFromPod

[MetaResources]
x_IRC = irc://irc.perl.org/#native
