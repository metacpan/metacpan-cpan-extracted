---
# Created by App::GHGen::PerlCustomizer
name: Perl CI

"on":
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        perl:
          - "5.36"
          - "5.38"
          - "5.40"
          - "5.42"
        exclude:
          - os: windows-latest
            perl: "5.40"
    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}
    env:
      AUTOMATED_TESTING: 1
      NO_NETWORK_TESTING: 1
      NONINTERACTIVE_TESTING: 1
    steps:
      - uses: actions/checkout@v7

      - name: Setup Perl
        id: setup-perl
        uses: shogo82148/actions-setup-perl@v1.44.2
        with:
          perl-version: ${{ matrix.perl }}

      - name: Get exact Perl binary version for cache key
        id: perl-version
        shell: perl {0}
        run: |
          use Config;
          my @paths = ($^X);
          if ($^O eq 'MSWin32' && $Config{libperl}) {
              (my $dir = $^X) =~ s{[\\/][^\\/]+$}{};
              my $dll = "$dir/$Config{libperl}";
              push @paths, $dll if -f $dll;
          }
          my $sum = 0;
          for my $path (@paths) {
              open(my $fh, '<:raw', $path) or next;
              $sum += unpack('%32C*', $_) while read $fh, $_, 65536;
          }
          open(my $out, '>>', $ENV{GITHUB_OUTPUT}) or die $!;
          print $out "version=$Config{version}-$Config{archname}-$sum\n";

      - name: Cache CPAN modules
        uses: actions/cache@v6
        with:
          path: ~/perl5
          key: ${{ runner.os }}-perl-${{ steps.perl-version.outputs.version }}-${{ hashFiles('cpanfile') }}
          restore-keys: |
            ${{ runner.os }}-perl-${{ steps.perl-version.outputs.version }}-

      - name: Install cpanm and local::lib
        if: runner.os != 'Windows'
        run: cpanm --notest --local-lib=~/perl5 local::lib

      - name: Install cpanm and local::lib (Windows)
        if: runner.os == 'Windows'
        run: cpanm --notest App::cpanminus local::lib

      - name: Install DB_File, needed for a lot of CPAN modules
        if: runner.os == 'Linux'
        run: |
           sudo apt update
           sudo apt install libdb-dev libperl-dev
      - name: Install dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest --installdeps --verbose .

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo off
          set "PATH=%USERPROFILE%\perl5\bin;%PATH%"
          set "PERL5LIB=%USERPROFILE%\perl5\lib\perl5"
          cpanm --notest --installdeps --verbose .

      - name: Reinstall YAML::XS against current Perl (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cpanm --notest --reinstall YAML::XS

      - name: Lint and syntax check
        shell: perl {0}
        run: |
          use strict;
          use warnings;
          use File::Find;
          use lib 'lib';
          my @failed;
          push @INC, sub { open my $h, '<', \qq{1;\n}; $h };
          my @dirs = grep { -d } qw(lib bin);
          @dirs = ('.') unless @dirs;
          find({ wanted => sub {
              return unless -f && /\.pm$/;
              my $file = $File::Find::name;
              do $file;
              if ($@) {
                  warn "Syntax check failed: $file\n";
                  push @failed, $file;
              }
          }, no_chdir => 1 }, @dirs);

          if (($ENV{RUNNER_OS} // '') eq 'Linux') {
              system('cpanm --notest --quiet warnings::unused 2>/dev/null');
              system('PERL5OPT=-Mwarnings::unused prove -lr t/ 2>&1 | grep -i unused && true || echo "warnings::unused: no unused variables detected"');
          }

          exit(@failed ? 1 : 0);

      - name: Run tests
        if: runner.os != 'Windows'
        shell: bash
        # AUTOMATED_TESTING skips t/space-path.t; the plain test runs are where
        # paths with spaces are still checked (not the coverage run, where the
        # second pass of the suite takes most of an hour).
        env:
          SPACE_PATH: 1
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          prove -lr t/

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          SPACE_PATH: 1
        run: |
          @echo off
          set "PATH=%USERPROFILE%\perl5\bin;%PATH%"
          set "PERL5LIB=%USERPROFILE%\perl5\lib\perl5"
          prove -lr t/

      - name: Run Perl::Critic
        if: matrix.perl == '5.42' && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest Perl::Critic
          perlcritic --severity 3 lib/ || true
        shell: bash

      - name: Check imports with perlimports
        if: matrix.perl == '5.42' && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest App::perlimports
          find lib -name '*.pm' | xargs perlimports --lint
        shell: bash

      - name: Test coverage
        if: matrix.perl == '5.42' && matrix.os == 'ubuntu-latest'
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest Devel::Cover
          cover -delete
          HARNESS_PERL_SWITCHES=-MDevel::Cover prove -lr t/
          cover
        shell: bash

      - name: Show cpanm build log on failure (Windows)
        if: runner.os == 'Windows' && failure()
        shell: pwsh
        run: Get-Content "$env:USERPROFILE\.cpanm\work\*\build.log" -Tail 100

      - name: Show cpanm build log on failure (non-Windows)
        if: runner.os != 'Windows' && failure()
        run: tail -100 "$HOME/.cpanm/work/*/build.log"

  # Windows converts every text file to CRLF when it checks out, so a test
  # that assumes LF passes on Linux and fails only there.  This job makes the
  # same conversion on Linux, runs the suite and builds the distribution, so
  # the assumption fails on every push instead of waiting for the Windows leg
  # of the matrix.
  crlf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Suite from a CRLF checkout
    env:
      AUTOMATED_TESTING: 1
      NO_NETWORK_TESTING: 1
      NONINTERACTIVE_TESTING: 1
    steps:
      - uses: actions/checkout@v7

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1.44.2
        with:
          perl-version: '5.38'

      - name: Install cpanm and local::lib
        run: cpanm --notest --local-lib=~/perl5 local::lib

      - name: Install dependencies
        shell: bash
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          cpanm --notest --installdeps .

      # Every tracked text file gets CRLF line endings, including the tests
      # themselves.  The conversion then verifies itself: a file that still
      # has a bare LF, or a checkout with too few text files to be this
      # project, fails here rather than letting the suite pass for the wrong
      # reason.
      - name: Convert the checkout to CRLF
        shell: bash
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          perl -e '
          use strict;
          use warnings;

          my @files = split /\0/, qx{git ls-files -z};
          die "git ls-files returned nothing; is this a checkout?\n" unless @files;

          my ($text, $converted) = (0, 0);
          for my $file (@files) {
              next unless -f $file;
              open my $in, "<:raw", $file or die "cannot read $file: $!\n";
              my $bytes = do { local $/; <$in> };
              close $in;
              $bytes = "" unless defined $bytes;
              next if index($bytes, "\0") >= 0;

              $text++;
              (my $crlf = $bytes) =~ s/\r?\n/\r\n/g;
              next if $crlf eq $bytes;

              open my $out, ">:raw", $file or die "cannot write $file: $!\n";
              print {$out} $crlf;
              close $out or die "cannot write $file: $!\n";
              $converted++;
          }

          my @bare;
          for my $file (@files) {
              next unless -f $file;
              open my $in, "<:raw", $file or die "cannot read $file: $!\n";
              my $bytes = do { local $/; <$in> };
              close $in;
              next unless defined $bytes;
              next if index($bytes, "\0") >= 0;
              push @bare, $file if $bytes =~ /(?<!\r)\n/;
          }

          die "still LF: @bare\n" if @bare;
          die "found only $text text files; the checkout looks incomplete\n"
              if $text < 40;

          print "converted $converted of $text text files to CRLF\n";
          '

      - name: Run tests
        shell: bash
        run: |
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          prove -lr t/

      # prove reads the checkout in place; "make dist" reads what MANIFEST
      # names and packs it into the archive a release publishes.  Unpacking
      # that archive into a fresh directory and testing the copy checks what
      # the release actually contains - the tar and gzip steps and the file
      # modes included - rather than only the distribution directory make
      # left behind.  Doing it from the CRLF checkout also catches a MANIFEST
      # entry the conversion or the archive does not survive, and pod or
      # filename handling that only works with LF, before a release does.
      - name: Build, unpack and test the distribution
        shell: bash
        run: |
          set -eu
          eval $(perl -I ~/perl5/lib/perl5 -Mlocal::lib)
          perl Makefile.PL

          rm -f App-Actions-*.tar.gz
          make dist

          set -- App-Actions-*.tar.gz
          test "$#" -eq 1
          test -f "$1"
          tarball=$1

          unpacked=$(mktemp -d)
          tar -xzf "$tarball" -C "$unpacked"
          set -- "$unpacked"/*/
          test "$#" -eq 1
          test -d "$1"

          cd "$1"

          # The checkout was CRLF, so every source file in the archive should
          # still be.  The audit lives in t/ so that t/archive-crlf.t can
          # exercise its generated-file exemptions and failure messages too.
          perl t/bin/check-archive-crlf .

          perl Makefile.PL
          make test
