<text x="57" y="92" textLength="585" fill="#dcdfe4">the scrollbar and the wheel see the whole document. Two invisible</text>
<text x="57" y="110" textLength="648" fill="#dcdfe4">spacers stand in for the items above and below, so the scrollbar and the</text>
<text x="57" y="128" textLength="261" fill="#dcdfe4">wheel see the whole document.</text>
<text x="57" y="164" textLength="45" fill="#797b83">49994</text>
<text x="120" y="164" textLength="576" fill="#dcdfe4">An item is built once; its height is estimated until it has been</text>
<text x="57" y="182" textLength="639" fill="#dcdfe4">laid out, then measured. An item is built once; its height is estimated</text>
<text x="57" y="200" textLength="621" fill="#dcdfe4">until it has been laid out, then measured. An item is built once; its</text>
<text x="57" y="218" textLength="558" fill="#dcdfe4">height is estimated until it has been laid out, then measured.</text>
<text x="57" y="254" textLength="45" fill="#797b83">49995</text>
<text x="120" y="254" textLength="567" fill="#dcdfe4">The item at the top of the viewport stays where it is while the</text>
<text x="57" y="272" textLength="225" fill="#dcdfe4">heights around it change.</text>
<text x="57" y="308" textLength="45" fill="#797b83">49996</text>
<text x="120" y="308" textLength="558" fill="#dcdfe4">A VirtualList keeps its items as data and builds a widget only</text>
<text x="57" y="326" textLength="630" fill="#dcdfe4">for the items near the viewport. A VirtualList keeps its items as data</text>
<text x="57" y="344" textLength="513" fill="#dcdfe4">and builds a widget only for the items near the viewport.</text>
<text x="57" y="380" textLength="45" fill="#797b83">49997</text>
<text x="120" y="380" textLength="576" fill="#dcdfe4">Two invisible spacers stand in for the items above and below, so</text>
<text x="39" y="416" textLength="702" fill="#96a0b4">Paragraphs 49993-49997 of 50000, 19 built  |  Home End PgUp PgDn, Ctrl+C quits</text>
</g>
