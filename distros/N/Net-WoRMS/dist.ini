name    = Net-WoRMS
author  = Alexander Weidauer <alex.weidauer@huckfinn.de>
license = GPL_3
copyright_holder = Alexander Weidauer
copyright_year   = 2012
version = 1.9

[Prereqs]
perl = 5.020
Data::Dumper = 2.10
Moo = 2.0
MooX::Types::MooseLike::Base = 0.12
Pod::Usage = 1.60
Syntax::Keyword::Match = 0.15
SOAP::Lite = 0.711

[Run::BeforeBuild]
run = pandoc --from=org --to=plain    --output=CHANGELOG    meta/Changes.org
run = pandoc --from=org --to=plain    --output=SECURITY     meta/Security.org

[@Basic]

[ExecDir]
dir= bin

[PodSyntaxTests]

[ReadmeFromPod]

[MetaJSON]
[MetaProvides::Package]
[Test::Kwalitee]

[Clean]
