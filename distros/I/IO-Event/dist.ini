[@Author::Plicease]
:version           = 2.79
release_tests      = 1
installer          = MakeMaker
release_tests_skip = changes\.t
github_user        = uperl

workflow = static
workflow = linux

[RemovePrereqs]
remove = strict
remove = warnings
remove = Event
remove = Event::Watcher
remove = AnyEvent
remove = AnyEvent::Impl::Perl
remove = diagnostics
remove = IO::Event::Common

[Prereqs / RuntimeRecommends]
